  <link rel="icon" type="image/png" href="/assets/icon-192-dlsAbRcr.png" />
  <!-- GitHub Pages deep-link → HashRouter redirect -->
  <script>
    if (location.pathname.length > 1 && !location.hash.includes('#/')) {
      location.replace('/#' + location.pathname);
    }
  </script>

</head>
<body>
  <div id="root"></div>
  <!-- Pi Browser detection: warn if not opened in Pi Browser -->
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        if (!window.Pi) {
          var el = document.getElementById('root');
          if (el && !el.children.length) {
            el.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:system-ui,sans-serif;color:#334155">' +

              '<p style="font-size:14px;color:#64748b;max-width:280px">WorkPro runs inside the Pi Browser. Please open this page from the Pi Browser app to continue.</p>' +
              '</div>';
          }
        }
      }, 2500);
    });
  </script>
</body>
