<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Pro — Block Users</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f3f4f6; padding: 16px; }
  h1 { font-size: 22px; margin-bottom: 16px; color: #111; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .stat { background: #fff; padding: 12px; border-radius: 8px; text-align: center; }
  .stat .num { font-size: 24px; font-weight: 700; color: #10b981; }
  .stat .label { font-size: 12px; color: #6b7280; }
  .user { background: #fff; padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
  .user .name { font-weight: 600; font-size: 15px; }
  .user .meta { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .user .status { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; margin-left: 8px; }
  .status.active { background: #d1fae5; color: #065f46; }
  .status.blocked { background: #fee2e2; color: #991b1b; }
  .block-btn { background: none; border: none; font-size: 22px; cursor: pointer; padding: 4px 8px; }
  .block-btn:hover { transform: scale(1.2); }
  .loading { text-align: center; color: #6b7280; padding: 40px; }
  .error { background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
  .success { background: #d1fae5; color: #065f46; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
  .refresh { background: #10b981; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-bottom: 16px; }
</style>
</head>
<body>
<h1>Work Pro — User Management</h1>
<button class="refresh" onclick="loadUsers()">Refresh List</button>
<div id="message"></div>
<div class="stats">
  <div class="stat"><div class="num" id="totalUsers">-</div><div class="label">Total Users</div></div>
  <div class="stat"><div class="num" id="blockedUsers">-</div><div class="label">Blocked</div></div>
</div>
<div id="usersList"><div class="loading">Loading users...</div></div>

<script>
const API = 'https://workpro-api.onrender.com';
const ADMIN_UID = 'cherry19899';

function showMessage(text, isError) {
  const el = document.getElementById('message');
  el.className = isError ? 'error' : 'success';
  el.textContent = text;
  setTimeout(() => el.className = '', 3000);
}

async function loadUsers() {
  const list = document.getElementById('usersList');
  list.innerHTML = '<div class="loading">Loading users...</div>';
  try {
    const res = await fetch(API + '/api/admin/users?page=1&limit=200', {
      headers: { 'x-user-id': ADMIN_UID, 'x-api-key': 'dev' }
    });
    const users = await res.json();
    const userArray = Array.isArray(users) ? users : (users.users || users.rows || []);
    renderUsers(userArray);
  } catch (e) {
    list.innerHTML = '<div class="error">Error: ' + e.message + '</div>';
  }
}

function renderUsers(users) {
  const list = document.getElementById('usersList');
  let blocked = 0;
  let html = '';
  users.forEach(u => {
    const username = u.username || u.name || u.id;
    const role = u.role || 'freelancer';
    const status = u.status || 'active';
    const kyc = u.kyc_status || 'No KYC';
    const balance = u.balance_connects || 0;
    if (status === 'blocked') blocked++;
    const statusClass = status === 'blocked' ? 'blocked' : 'active';
    const statusText = status === 'blocked' ? 'BLOCKED' : 'Active';
    html += `<div class="user" id="user-${u.id}">
      <div>
        <div class="name">${username} <span class="status ${statusClass}">${statusText}</span></div>
        <div class="meta">${role} | ${kyc} | Connects: ${balance}</div>
      </div>
      <button class="block-btn" title="${status === 'blocked' ? 'Unblock' : 'Block'}" onclick="toggleBlock('${u.id}', '${username}', ${status === 'blocked'})">
        ${status === 'blocked' ? '✅' : '🚫'}
      </button>
    </div>`;
  });
  list.innerHTML = html;
  document.getElementById('totalUsers').textContent = users.length;
  document.getElementById('blockedUsers').textContent = blocked;
}

async function toggleBlock(userId, username, isBlocked) {
  const action = isBlocked ? 'unblock' : 'block';
  try {
    const res = await fetch(API + '/api/admin/users/' + encodeURIComponent(userId) + '/' + action, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-user-id': ADMIN_UID, 'x-api-key': 'dev' }
    });
    const data = await res.json();
    if (data.success) {
      showMessage((isBlocked ? 'Unblocked' : 'Blocked') + ': ' + username);
      // Update UI
      const card = document.getElementById('user-' + userId);
      if (card) {
        const btn = card.querySelector('.block-btn');
        const badge = card.querySelector('.status');
        if (isBlocked) {
          btn.innerHTML = '🚫';
          btn.title = 'Block';
          badge.className = 'status active';
          badge.textContent = 'Active';
          btn.setAttribute('onclick', `toggleBlock('${userId}', '${username}', false)`);
        } else {
          btn.innerHTML = '✅';
          btn.title = 'Unblock';
          badge.className = 'status blocked';
          badge.textContent = 'BLOCKED';
          btn.setAttribute('onclick', `toggleBlock('${userId}', '${username}', true)`);
        }
      }
      // Update stats
      loadUsers();
    } else {
      showMessage('Error: ' + (data.error || 'Unknown'), true);
    }
  } catch (e) {
    showMessage('Error: ' + e.message, true);
  }
}

// Load on startup
loadUsers();
</script>
</body>
</html>
