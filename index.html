<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#10b981">
<title>Work Pro</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.ico">
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<link rel="stylesheet" href="assets/app-v173.css">
<style>
body { margin: 0; background: #0f172a; }
#loader {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: #0f172a; display: flex; flex-direction: column;
  align-items: center; justify-content: center; z-index: 9999;
}
#loader h1 { font-size: 32px; font-weight: 700; color: #10b981; margin-bottom: 16px; }
#loader p { color: #94a3b8; font-size: 14px; }
.spinner {
  width: 40px; height: 40px; border: 3px solid #1e293b;
  border-top-color: #10b981; border-radius: 50%;
  animation: spin 1s linear infinite; margin-top: 24px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>
<div id="loader">
<h1>Work Pro</h1>
<p>Loading...</p>
<div class="spinner"></div>
</div>
<script>
// Hide loader when app renders
var checkInterval = setInterval(function() {
  var root = document.getElementById('root');
  var loader = document.getElementById('loader');
  if (root && root.children.length > 0) {
    loader.style.display = 'none';
    clearInterval(checkInterval);
  }
}, 500);
setTimeout(function() { clearInterval(checkInterval); }, 30000);
</script>
<script src="assets/app-v200.js?v=649" onload="document.getElementById('loader').style.display='none'"></script>
</body>
</html>
