        var newFile = new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), {type: 'image/jpeg'});
        var dt = new DataTransfer();
        dt.items.add(newFile);
        input.files = dt.files;
        input.__workpro_compressed = true;
        input.__workpro_processing = false;
        // Re-dispatch change so React picks up compressed file
        input.dispatchEvent(new Event('change', {bubbles: true}));
      }).catch(function(err) {
        input.__workpro_processing = false;
        console.error('[WorkPro] compress error:', err);
      });
    }, true);
  })();

  <script>
  (function() {
    var API = 'https://workpro-api.onrender.com';
    var adminPanel = document.getElementById('admin-panel');
    var adminToggle = document.getElementById('admin-toggle');
    var adminStats = document.getElementById('admin-stats');
    var adminLog = document.getElementById('admin-log');
    var logLines = [];

    function log(msg) {
      var t = new Date().toLocaleTimeString();
      logLines.push('[' + t + '] ' + msg);
      if (logLines.length > 50) logLines.shift();
      if (adminLog) adminLog.textContent = logLines.join('\n');
    }

    function checkAdmin() {
      try {
        var userStr = localStorage.getItem('workpro_user');
        if (!userStr) { setTimeout(checkAdmin, 3000); return; }
        var user = JSON.parse(userStr);
        if (user && (user.username === 'cherry19899' || user.username === 'admin' || user.is_admin)) {
          adminToggle.style.display = 'flex';
          log('Admin: ' + user.username);
          loadStats();
        }
      } catch(e) { setTimeout(checkAdmin, 3000); }
    }

    function loadStats() {
      fetch(API + '/api/admin/stats').then(function(r) { return r.json(); }).then(function(data) {
        if (data.error) { log('Stats: ' + data.error); return; }
        adminStats.innerHTML =
          '<div style="background:#0f172a;border-radius:8px;padding:8px;text-align:center;"><div style="font-size:18px;font-weight:700;color:#38bdf8;">' + (data.total_users || 0) + '</div><div style="font-size:11px;color:#94a3b8;">Users</div></div>' +
          '<div style="background:#0f172a;border-radius:8px;padding:8px;text-align:center;"><div style="font-size:18px;font-weight:700;color:#38bdf8;">' + (data.total_jobs || 0) + '</div><div style="font-size:11px;color:#94a3b8;">Jobs</div></div>' +
          '<div style="background:#0f172a;border-radius:8px;padding:8px;text-align:center;"><div style="font-size:18px;font-weight:700;color:#38bdf8;">' + (data.total_applications || 0) + '</div><div style="font-size:11px;color:#94a3b8;">Applications</div></div>' +
          '<div style="background:#0f172a;border-radius:8px;padding:8px;text-align:center;"><div style="font-size:18px;font-weight:700;color:#38bdf8;">' + (data.total_escrows || 0) + '</div><div style="font-size:11px;color:#94a3b8;">Escrows</div></div>';
        log('Stats OK');
      }).catch(function(e) { log('Stats err: ' + e.message); });
    }

    if (adminToggle) {
      adminToggle.addEventListener('click', function() {
        adminPanel.style.display = adminPanel.style.display === 'none' ? 'block' : 'none';
        if (adminPanel.style.display === 'block') loadStats();
      });
    }
    if (document.getElementById('admin-close')) {
      document.getElementById('admin-close').addEventListener('click', function() { adminPanel.style.display = 'none'; });
    }
    if (document.getElementById('admin-deploy')) {
      document.getElementById('admin-deploy').addEventListener('click', function() {
        log('Deploying backend...');
        fetch('https://api.render.com/deploy/srv-d7qvgf7lk1mc73cri1ng?key=X88S-SyFKag', { method: 'POST' })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.deploy && data.deploy.id) log('✅ Deploy triggered!');
            else log('❌ Failed: ' + JSON.stringify(data).slice(0, 80));
          })
          .catch(function(e) { log('❌ Error: ' + e.message); });
      });
    }
    if (document.getElementById('admin-refresh')) {
      document.getElementById('admin-refresh').addEventListener('click', function() { loadStats(); log('Refreshed'); });
    }

    log('Admin ready');
    setTimeout(checkAdmin, 2000);
  })();
  </script>
