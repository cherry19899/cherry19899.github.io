  <script>
  // Monkey-patch JSON.parse to fix v182 bundle compatibility issues
  (function() {
    var origParse = JSON.parse;
    JSON.parse = function(text, reviver) {
      var data = origParse.call(this, text, reviver);
      function fixJob(job) {
        if (!job || typeof job !== 'object') return job;
        // Fix null images -> [] (v182 expects array)
        if (job.images === null || job.images === undefined) {
          job.images = [];
        }
        // Fix null deadline -> '' (v182 expects string)
        if (job.deadline === null || job.deadline === undefined) {
          job.deadline = '';
        }
        // Add requirements if missing (v182 expects it)
        if (job.requirements === undefined) {
          job.requirements = job.description || job.message || '';
        }
        // Convert array skills -> string for v182
        if (Array.isArray(job.skills)) {
          job.skills = job.skills.join(',');
        }
        return job;
      }
      function fixUser(user) {
        if (!user || typeof user !== 'object') return user;
        if (Array.isArray(user.skills)) {
          user.skills = user.skills.join(',');
        }
        return user;
      }
      if (data && typeof data === 'object') {
        // Single job object
        if (data.id !== undefined && data.title !== undefined) {
          fixJob(data);
        }
        // Array of jobs
        if (Array.isArray(data)) {
          data.forEach(function(item) {
            if (item && item.id !== undefined && item.title !== undefined) {
              fixJob(item);
            }
          });
        }
        // Jobs wrapper
        if (data.jobs && Array.isArray(data.jobs)) {
          data.jobs.forEach(fixJob);
        }
        // User object
        if (data.user && typeof data.user === 'object') {
          fixUser(data.user);
        }
        if (data.id !== undefined && data.username !== undefined) {
          fixUser(data);
        }
      }
      return data;
    };
  })();
  </script>
  <script>
  // Monkey-patch Response.prototype.json() to fix v182 bundle compatibility
  (function() {
    var origJson = Response.prototype.json;
    Response.prototype.json = function() {
      return origJson.call(this).then(function(data) {
        function fixJob(job) {
          if (!job || typeof job !== 'object') return job;
          // Fix null images -> [] (v182 expects array)
          if (job.images === null || job.images === undefined) {
            job.images = [];
          }
          // Fix null deadline -> '' (v182 expects string)
          if (job.deadline === null || job.deadline === undefined) {
            job.deadline = '';
          }
          // Add requirements if missing (v182 expects it)
          if (job.requirements === undefined) {
            job.requirements = job.description || job.message || '';
          }
          // Convert array skills -> string for v182
          if (Array.isArray(job.skills)) {
            job.skills = job.skills.join(',');
          }
          return job;
        }
        function fixUser(user) {
          if (!user || typeof user !== 'object') return user;
          if (Array.isArray(user.skills)) {
            user.skills = user.skills.join(',');
          }
          return user;
        }
        function fixSkills(obj) {
          if (obj && Array.isArray(obj.skills)) obj.skills = obj.skills.join(',');
        }
        if (data && typeof data === 'object') {
          fixSkills(data);
          if (Array.isArray(data.jobs)) data.jobs.forEach(fixJob);
          if (Array.isArray(data.applications)) data.applications.forEach(fixSkills);
          if (Array.isArray(data.freelancers)) data.freelancers.forEach(fixSkills);
          if (Array.isArray(data)) data.forEach(function(item) {
            fixSkills(item);
            if (item && item.id !== undefined && item.title !== undefined) fixJob(item);
          });
          // Single job object
          if (data.id !== undefined && data.title !== undefined) {
            fixJob(data);
          }
          // User object
          if (data.user && typeof data.user === 'object') {
            fixUser(data.user);
          }
          if (data.id !== undefined && data.username !== undefined) {
            fixUser(data);
          }
        }
        return data;
      });
    };
  })();
  </script>

    <script>
    // ---- PI SDK INIT (must run BEFORE bundle) ----
    (function() {
      var _initAttempts = 0;
      var _initMaxAttempts = 100; // 100 * 100ms = 10 seconds max wait
      window._piSdkReady = false;
      function tryInit() {
        _initAttempts++;
        if (!window.Pi || typeof window.Pi.init !== 'function') {
          if (_initAttempts < _initMaxAttempts) {
            setTimeout(tryInit, 100); // faster polling
          } else {
            console.error('[Pi] SDK not loaded after ' + _initMaxAttempts + ' attempts');
            window._piSdkReady = false;
          }
          return;
        }
        if (window.Pi._workpro_inited) { window._piSdkReady = true; return; }
        try {
          var isSandbox = /github\.io|localhost|onrender/.test(location.hostname);
          window.Pi.init({ 
            version: "2.0", 
            sandbox: isSandbox,
            onIncompletePayment: function(payment) {
              console.log('[Pi] onIncompletePayment called', payment);
              var paymentId = payment && (payment.identifier || payment.paymentId || payment.transactionId || payment.id);
              if (!paymentId) {
                console.warn('[Pi] No paymentId found in incomplete payment');
                return Promise.resolve();
              }
              // Check if payment is developer_completed — needs /resolve-complete, NOT /cancelled
              var st = payment && payment.status;
              var isCompleted = false;
              if (typeof st === 'string') {
                isCompleted = st === 'developer_completed' || st === 'completed';
              } else if (st && typeof st === 'object') {
                isCompleted = st.development_completed === true || st.transaction_verified === true;
              }
              var uid = localStorage.getItem('workpro_user_id') || '';
              var endpoint = isCompleted ? '/resolve-complete' : '/cancelled';
              console.log('[Pi] onIncompletePayment: status=' + (typeof st === 'string' ? st : JSON.stringify(st)) + ' -> endpoint=' + endpoint);
              return fetch('https://workpro-api.onrender.com/api/payments/' + paymentId + endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-user-id': uid }
              }).then(function(r) {
                console.log('[Pi] onIncompletePayment ' + endpoint + ' status:', r.status);
                return r.json().catch(function(){return {};}); 
              }).then(function(data) {
                return fetch('https://workpro-api.onrender.com/api/payments/clear-pending', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'x-user-id': uid }
                }).then(function(){return data;}).catch(function(){return data;});
              }).then(function(data) {
                console.log('[Pi] onIncompletePayment handled, waiting 5s for Pi Network...');
                // CRITICAL: wait for Pi Network to update payment status before resolving
                return new Promise(function(resolve){
                  setTimeout(function(){
                    console.log('[Pi] onIncompletePayment resolved after delay');
                    resolve({ handled: true, resolved: isCompleted, cancelled: !isCompleted });
                  }, 5000);
                });
              }).catch(function(err) {
                console.error('[Pi] onIncompletePayment error:', err);
                return { handled: true, error: err.message };
              });
            }
          });
          window.Pi._workpro_inited = true;
          window._piSdkReady = true;
          console.log('[Pi] SDK initialized, sandbox=' + isSandbox);
        } catch(e) {
          console.error('[Pi] init error (attempt ' + _initAttempts + '):', e.message || e);
          if (_initAttempts < _initMaxAttempts) {
            setTimeout(tryInit, 500);
          }
        }
      }
      tryInit();
    })();
    </script>
    <!-- v304: Service Worker + Chat Polling + Push Notifications -->
    <script>
    (function(){
      var API = 'https://workpro-api.onrender.com';
      var UID = localStorage.getItem('workpro_user_id') || '';

      // 1. Register Service Worker for PWA + Push
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          if (window.location.hostname === 'localhost') return;
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('[SW] Registered:', reg.scope);
            // 2. Request push notification permission
            if ('PushManager' in window) {
              reg.pushManager.getSubscription().then(function(sub) {
                if (!sub) {
                  console.log('[Push] Not subscribed yet');
                } else {
                  console.log('[Push] Already subscribed');
                  // Send subscription to backend
                  sendPushSubToBackend(sub);
                }
              });
            }
          }).catch(function(err) {
            console.log('[SW] Registration failed:', err.message);
          });
        });
      }

      // 3. Request permission and subscribe to push
      window._requestPushPermission = function() {
        if (!('Notification' in window)) { console.log('[Push] Notifications not supported'); return; }
        Notification.requestPermission().then(function(perm) {
          console.log('[Push] Permission:', perm);
          if (perm === 'granted') {
            navigator.serviceWorker.ready.then(function(reg) {
              // Use applicationServerKey from backend (VAPID public key)
              // For now, subscribe without key (server will use VAPID later)
              reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(localStorage.getItem('workpro_vapid_key') || 'BEl62iTMVmIwRhO5bsfW9J6iPC_8DmkSqFGGj3hN0YHzC0YwL8-6Y4g9Q3M1X7cT')
              }).then(function(sub) {
                console.log('[Push] Subscribed:', sub.endpoint);
                sendPushSubToBackend(sub);
              }).catch(function(err) {
                console.error('[Push] Subscribe error:', err.message);
              });
            });
          }
        });
      };

      function sendPushSubToBackend(sub) {
        var uid = localStorage.getItem('workpro_user_id');
        if (!uid) return;
        fetch(API + '/api/push/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-user-id': uid },
          body: JSON.stringify({ endpoint: sub.endpoint, keys: sub.toJSON().keys })
        }).then(function(r){return r.json();}).then(function(d){
          console.log('[Push] Backend sync:', d.success);
        }).catch(function(e){console.error('[Push] Backend sync error:', e);});
      }

      function urlBase64ToUint8Array(base64String) {
        var padding = '='.repeat((4 - base64String.length % 4) % 4);
        var base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
        var rawData = atob(base64);
        var outputArray = new Uint8Array(rawData.length);
        for (var i = 0; i < rawData.length; ++i) { outputArray[i] = rawData.charCodeAt(i); }
        return outputArray;
      }

      // 4. Show local notification helper
      window._showLocalNotification = function(title, body, icon) {
        if (!('Notification' in window) || Notification.permission !== 'granted') return;
        navigator.serviceWorker.ready.then(function(reg) {
          reg.showNotification(title || 'Work Pro', {
            body: body || '',
            icon: icon || '/vite.svg',
            badge: '/vite.svg',
            tag: 'workpro-' + Date.now(),
            requireInteraction: false
          });
        });
      };
      // 2. Chat polling — check for new messages every 5 seconds
      var _chatPollInterval = null;
      var _lastChatCheck = 0;
      window._startChatPolling = function() {
        if (_chatPollInterval) return;
        console.log('[Chat] Starting polling...');
        _chatPollInterval = setInterval(function(){
          var uid = localStorage.getItem('workpro_user_id');
          if (!uid) return;
          var now = Date.now();
          if (now - _lastChatCheck < 5000) return;
          _lastChatCheck = now;
          fetch('https://workpro-api.onrender.com/api/notifications/unread-count', {
            headers: {'x-user-id': uid}
          }).then(function(r){return r.json();}).then(function(d){
            var count = d.unread_count || 0;
            if (count > 0) {
              console.log('[Chat] Unread:', count);
              // Dispatch custom event for React to pick up
              window.dispatchEvent(new CustomEvent('workpro:new-messages', {detail: {count: count}}));
            }
          }).catch(function(){});
        }, 5000);
      };
      window._stopChatPolling = function() {
        if (_chatPollInterval) { clearInterval(_chatPollInterval); _chatPollInterval = null; }
      };
      // Auto-start if authenticated
      if (localStorage.getItem('workpro_user_id')) {
        setTimeout(window._startChatPolling, 3000);
      }
      console.log('[WP] v303 SW + Chat polling ready');
    })();
    </script>
