<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d9488">
<title>Work Pro</title>
<script>window.WORKPRO_VERSION='v168';window.__wpStart=Date.now();</script>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>
try{
(function(){
  console.log('[Pi] checking typeof Pi:',typeof Pi);
  if(typeof Pi==='undefined'){console.error('[Pi] SDK not loaded');return;}
  if(!Pi.init){console.error('[Pi] init method not found');return;}
  if(Pi._initialized){console.log('[Pi] already init');return;}
  var isSandbox=/github\.io|localhost/.test(location.hostname);
  console.log('[Pi] sandbox:',isSandbox);
  Pi.init({version:"2.0",sandbox:isSandbox});
  Pi._initialized=true;
  console.log('[Pi] init ok');
})();
}catch(e){
  console.error('[Pi] CRITICAL:',e.name,e.message);
  if(window.__c)window.__c.innerHTML+='<div style=\"color:#f00\">[Pi] CRITICAL: '+e.name+' '+e.message+'</div>';
}
</script>
<link rel="stylesheet" href="/assets/workpro.css?v=172" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#f0fdf4 0%,#ecfdf5 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
#_l{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;background:linear-gradient(135deg,#f0fdf4 0%,#ecfdf5 100%);transition:opacity .5s}
#_l h1{color:#0d9488;font-size:36px;margin-bottom:8px;letter-spacing:-1px}
#_l p{color:#6b7280;font-size:15px;margin-bottom:30px}
#_s{width:44px;height:44px;border:3px solid #d1d5db;border-top-color:#0d9488;border-radius:50%;animation:_spin 1s linear infinite;margin-bottom:20px}
#_b{width:180px;height:4px;background:#d1d5db;border-radius:2px;overflow:hidden;margin-bottom:12px}
#_bf{height:100%;background:#0d9488;width:0%;transition:width .5s}
#_e{display:none;color:#dc2626;font-size:14px;text-align:center;max-width:280px;padding:0 20px}
#_r{display:none;background:#0d9488;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:16px;cursor:pointer;margin-top:12px}
#_a{color:#0d9488;font-size:13px;margin-top:8px;text-decoration:underline}
#root{min-height:100vh;width:100%}
@keyframes _spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="_l">
<h1>Work Pro</h1>
<p>Freelance marketplace in Pi</p>
<div id="_s"></div>
<div id="_b"><div id="_bf"></div></div>
<div id="_e">Loading is taking too long.<br>Please check your connection.</div>
<button id="_r" onclick="location.reload()">Reload</button>
<a href="https://workpro-api.onrender.com/" id="_a">Alternative link</a>
</div>
<div id="root"></div>
<div id="__c" style="position:fixed;bottom:0;left:0;right:0;max-height:120px;overflow-y:auto;background:rgba(0,0,0,.85);color:#0f0;font-family:monospace;font-size:10px;line-height:1.4;padding:6px;z-index:99998;display:none;border-top:2px solid #0f0;"></div>
<script>
(function(){var c=document.getElementById('__c'),cnt=0;
function lg(t,m){if(!c)return;cnt++;if(cnt>50)return;c.style.display='block';var d=document.createElement('div');d.style.color=t;d.textContent=m;c.appendChild(d);}
lg('#0f0','[WP] v172 start');
var o=console.log,oe=console.error,ow=console.warn;
console.log=function(){var a=Array.prototype.slice.call(arguments).join(' ');o.apply(console,arguments);lg('#0f0','[L] '+a);};
console.error=function(){var a=Array.prototype.slice.call(arguments).join(' ');oe.apply(console,arguments);lg('#f00','[E] '+a);};
console.warn=function(){var a=Array.prototype.slice.call(arguments).join(' ');ow.apply(console,arguments);lg('#ff0','[W] '+a);};
window.onerror=function(m,u,l,co,err){lg('#f00','[ERR] '+m+' @'+l+':'+co);return true;};
window.onunhandledrejection=function(e){lg('#f00','[REJ] '+(e.reason&&e.reason.message||String(e.reason)));};
})();
</script>
<script>
(function(){
  var JS='/assets/workpro.js?v=172';
  var sc=document.createElement('script');
  sc.src=JS;
  sc.onload=function(){
    console.log('[Loader] JS loaded ok');
    var l=document.getElementById('_l');
    if(l){l.style.opacity='0';setTimeout(function(){l.style.display='none';},500);}
  };
  sc.onerror=function(){
    console.error('[Loader] JS load failed');
    var l=document.getElementById('_l'),e=document.getElementById('_e'),r=document.getElementById('_r'),a=document.getElementById('_a');
    if(l)l.style.display='none';
    if(e)e.innerHTML='Failed to load app.<br>Tap Reload to retry.';
    if(e)e.style.display='block';
    if(r)r.style.display='inline-block';
    if(a)a.style.display='block';
  };
  document.body.appendChild(sc);
  // Timeout: if JS doesn't load in 12s, show retry
  setTimeout(function(){
    if(!window.React&&!window.__appLoaded){
      console.error('[Loader] JS timeout after 12s');
      var l=document.getElementById('_l'),e=document.getElementById('_e'),r=document.getElementById('_r'),a=document.getElementById('_a');
      if(l)l.style.display='none';
      if(e)e.innerHTML='Loading timed out.<br>Tap Reload to retry.';
      if(e)e.style.display='block';
      if(r)r.style.display='inline-block';
      if(a)a.style.display='block';
    }
  },12000);
})();
</script>
</body>
</html>
