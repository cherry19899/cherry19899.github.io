<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#10b981" />
  <meta name="description" content="WorkPro — Freelance marketplace on Pi Network" />
  <title>WorkPro</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <!-- iOS ignores the manifest: without these it puts a page screenshot on the
       home screen instead of the app icon, and opens in a Safari tab. -->
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Work Pro" />
  <!-- GitHub Pages deep-link → HashRouter redirect -->
  <script>
    if (location.pathname.length > 1 && !location.hash.includes('#/')) {
      location.replace('/#' + location.pathname);
    }
  </script>
  <!-- Pi SDK — loads synchronously (no crossorigin: real Pi Browser fails the load
       otherwise) so window.Pi is available before the app bundle. -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <!-- Pi Browser detection: warn if not opened in Pi Browser -->
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        if (!window.Pi) {
          var el = document.getElementById('root');
          if (el && !el.children.length) {
            el.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:system-ui,sans-serif;color:#334155">' +
              '<div style="font-size:48px;margin-bottom:16px">π</div>' +
              '<h1 style="font-size:18px;font-weight:700;margin:0 0 8px">Open in Pi Browser</h1>' +
              '<p style="font-size:14px;color:#64748b;max-width:280px">WorkPro runs inside the Pi Browser. Please open this page from the Pi Browser app to continue.</p>' +
              '</div>';
          }
        }
      }, 2500);
    });
  </script>
</body>
</html>
