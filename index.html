        // 3. Force-check server version

        fetch('/?version-check=1', { cache: 'no-store' })
          .then(function(r) { return r.text(); })
          .then(function(html) {
            var m = html.match(/WORKPRO_VERSION='(v\d+)'/);
            var serverVersion = m ? m[1] : 'unknown';
            if (serverVersion !== myVersion && serverVersion !== 'unknown' && myVersion !== 'unknown') {
              location.reload(true);
            }
          })
          .catch(function() {});
      })();

    <!-- v554: force correct x-user-id header + balance_connects sync + own-job apply hide -->
    <script>
    (function(){
      var API = 'https://workpro-api.onrender.com';
      var CANONICAL_UID = 'pi_cherry19899'; // All data lives under this ID
      // Bug#11 fix: strip all leading 'pi_' prefixes for uid comparison
      // Some jobs have posted_by='pi_pi_cherry19899' (double-prefixed) — normalize before comparing
      function _normUid(uid) {
        while (uid && uid.indexOf('pi_') === 0) uid = uid.slice(3);
        return uid || '';
      }
      var _CANON_NORM = _normUid(CANONICAL_UID); // 'cherry19899'

      // ── 1. Fetch interceptor: force correct x-user-id on all API calls ──────
      // The bundle may send x-user-id: cherry19899 (username), but data is stored
      // under pi_cherry19899. We rewrite any x-user-id that belongs to this user.
      var _rawFetch = window.fetch;
      window.fetch = function(input, init) {
        try {
          var urlStr = typeof input === 'string' ? input : (input && input.url) || '';
          if (urlStr.indexOf(API) !== -1) {
            
            init = init ? Object.assign({}, init) : {};
            init.headers = init.headers ? Object.assign({}, init.headers) : {};
            // Normalise Headers object → plain object
            if (typeof Headers !== 'undefined' && init.headers instanceof Headers) {
              var plain = {};
              init.headers.forEach(function(v,k){ plain[k] = v; });
              init.headers = plain;
            }
            // Inject JWT Authorization header for admin API calls (bundle's Oe() doesn't send it)
            if (urlStr.indexOf('/api/admin/') !== -1 && !init.headers['Authorization'] && !init.headers['authorization']) {
              var _tok = localStorage.getItem('workpro_token') || '';
              if (_tok) init.headers['Authorization'] = 'Bearer ' + _tok;
            }
            var curId = init.headers['x-user-id'] || init.headers['X-User-Id'] || '';
            // Rewrite cherry19899 (username) → pi_cherry19899 (canonical ID) only
            // Do NOT add x-user-id when it is absent — let JWT auth handle unauthenticated calls
            if (curId === 'cherry19899') {
              init.headers['x-user-id'] = CANONICAL_UID;
            }
            // Bug#12: rewrite /api/jobs/user/:username — bundle sends username without pi_ prefix
            // e.g. /api/jobs/user/cherry19899 → /api/jobs/user/pi_cherry19899
            var userJobMatch = urlStr.match(/\/api\/jobs\/user\/([^/?#]+)/);
            if (userJobMatch) {
              var uname = userJobMatch[1];
              if (uname.indexOf('pi_') !== 0) {
                input = urlStr.replace('/api/jobs/user/' + uname, '/api/jobs/user/pi_' + uname);
              }
            }
          }
        } catch(e) {}
        var result = _rawFetch.call(this, input, init);
        // notifications fallback removed — was leaking cherry19899's data to other users

        // ── Intercept /api/jobs LIST response: remap status open→in_progress ──
        // Bug in bundle v200: Find Work feed hides all status='open' jobs.
        // Workaround: change 'open' → 'in_progress' in list response so they render.
        // Individual job detail (/api/jobs/:id) is left untouched → Apply button works.
        // v586: also track open job IDs so MutationObserver can replace "Работа занята" label.
        try {
          var urlStr3 = typeof input === 'string' ? input : (input && input.url) || '';
          var isJobsList = /\/api\/jobs(\?|$)/.test(urlStr3) && (!init || !init.method || init.method === 'GET');
          if (isJobsList) {
            result = result.then(function(resp) {
              return resp.clone().json().then(function(d) {
                if (d && d.jobs && Array.isArray(d.jobs)) {
                  window._wp_openJobIds = window._wp_openJobIds || {};
                  d.jobs = d.jobs.map(function(j) {
                    if (j.status === 'open' || j._open) {
                      window._wp_openJobIds[j.id] = true;
                      return Object.assign({}, j, { status: 'in_progress', _real_status: 'open', _open: true });
                    }
                    return j;
                  });
                  return new Response(JSON.stringify(d), {
                    status: 200, headers: { 'Content-Type': 'application/json' }
                  });
                }
                return resp;
              }).catch(function() { return resp; });
            });
          }
        } catch(e) {}

        // ── Intercept individual job detail response: cache for Apply Now overlay ─
        try {
          var urlStr4 = typeof input === 'string' ? input : (input && input.url) || '';
          var jobDetailMatch = urlStr4.match(/\/api\/jobs\/(\d+)(?:\?|$)/);
          var isJobDetailGET = jobDetailMatch && (!init || !init.method || init.method === 'GET');
          if (isJobDetailGET) {
            result = result.then(function(resp) {
              return resp.clone().json().then(function(d) {
                // API returns {job:{...},applications:[]} — unwrap the job object
                var jobObj = (d && d.job && d.job.id) ? d.job : (d && d.id ? d : null);
                if (jobObj && jobObj.id) {
                  window._wp_currentJobDetail = jobObj;
                  if (jobObj._open || jobObj.status === 'open') window._wp_openJobs[jobObj.id] = jobObj;
                }
                return resp;
              }).catch(function() { return resp; });
            });
          }
        } catch(e) {}

        return result;
      };

      // ── 1b. XHR interceptor: fix headers + intercept notifications/applications ─
      var _origXHROpen = XMLHttpRequest.prototype.open;
      var _origXHRSetReqHeader = XMLHttpRequest.prototype.setRequestHeader;
      var _origXHRSend = XMLHttpRequest.prototype.send;
      XMLHttpRequest.prototype.open = function(method, url) {
        this._v554url = String(url || '');
        this._v554method = method;
        this._v554headers = {};
        if (String(url||'').indexOf(API) !== -1) {
          
        }
        return _origXHROpen.apply(this, arguments);
      };
      XMLHttpRequest.prototype.setRequestHeader = function(name, value) {
        this._v554headers = this._v554headers || {};
        this._v554headers[name.toLowerCase()] = value;
        // Rewrite cherry19899 → pi_cherry19899 in x-user-id
        if (name.toLowerCase() === 'x-user-id' && value === 'cherry19899') {
          value = CANONICAL_UID;
        }
        return _origXHRSetReqHeader.call(this, name, value);
      };
      XMLHttpRequest.prototype.send = function(body) {
        var xhr = this;
        var url = this._v554url || '';
        var method = (this._v554method || 'GET').toUpperCase();
        // XHR notifications/applications fallback removed — was leaking cherry19899's data to other users
        // Cache job detail response for Apply Now overlay
        var jobDetailXHR = url.match(/\/api\/jobs\/(\d+)$/);
        if (jobDetailXHR && method === 'GET') {
          this.addEventListener('readystatechange', function() {
            if (xhr.readyState !== 4 || xhr.status !== 200) return;
            try {
              var d = JSON.parse(xhr.responseText);
              // API returns {job:{...},applications:[]} — unwrap
              var jobObj = (d && d.job && d.job.id) ? d.job : (d && d.id ? d : null);
              if (jobObj && jobObj.id) {
                window._wp_currentJobDetail = jobObj;
                if (jobObj._open || jobObj.status === 'open') window._wp_openJobs[jobObj.id] = jobObj;
              }
            } catch(e) {}
          });
        }
        return _origXHRSend.apply(this, arguments);
      };

      // ── 1c. JWT bootstrap: get real JWT for any logged-in user ─────────────
      // Bundle's authPi() stores fake token ("pi_" + 8 chars) and never writes
      // workpro_token. POST /api/me without accessToken issues real 30-day JWT
      // for any existing account. Run for every user on page load.
      (function() {
        try {
          var _bu = JSON.parse(localStorage.getItem('workpro_user') || 'null');
          var _uid = _bu && (_bu.id || _bu.uid);
          if (_uid) {
            var _existTok = localStorage.getItem('workpro_token');
            // Refresh if missing or still the fake "pi_XXXXXXXX" token
            if (!_existTok || _existTok.length < 20 || _existTok.startsWith('pi_')) {
              fetch(API + '/api/me', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ uid: _uid, username: _bu.username || '' })
              }).then(function(r) { return r.ok ? r.json() : null; })
                .then(function(d) {
                  if (d && d.token) {
                    localStorage.setItem('workpro_token', d.token);
                  }
                }).catch(function() {});
            }
          }
        } catch(e) {}
      })();

      // ── 1d. localStorage.setItem interceptor: get JWT + fix stale connects on user switch ──
      // Page-load bootstrap (1c) only helps returning users. For first-time logins
      // the bundle calls POST /api/me, then writes workpro_user — intercept to get JWT.
      // Also: when a DIFFERENT user logs in, the old workpro_connects value (e.g. 108
      // from cherry19899) stays in localStorage and overrides the new user's real balance.
      // We clear workpro_connects when the uid changes so the server value wins.
      (function() {
        var _origSetItem = localStorage.setItem.bind(localStorage);
        localStorage._origSetItem = _origSetItem;
        var _lastKnownUid = null;
        try {
          var _initUser = JSON.parse(localStorage.getItem('workpro_user') || 'null');
          _lastKnownUid = _initUser && (_initUser.id || _initUser.uid);
        } catch(e) {}

        localStorage.setItem = function(key, value) {
          _origSetItem(key, value);
          if (key === 'workpro_user') {
            try {
              var _u = JSON.parse(value || 'null');
              var _uid = _u && (_u.id || _u.uid);
              if (_uid) {
                // If a DIFFERENT user logged in, write the NEW user's real balance
                // so the bundle's setItem interceptor reads the correct value (not stale).
                // Never write empty string — bundle renders NaN and hides the connects label.
                if (_lastKnownUid && _lastKnownUid !== _uid) {
                  var _newC = parseInt(_u.balance_connects || _u.connects || 0, 10);
                  var _newB = parseFloat(_u.balance_pi || 0);
                  _origSetItem('workpro_connects', String(isNaN(_newC) ? 0 : _newC));
                  _origSetItem('workpro_balance', String(isNaN(_newB) ? 0 : _newB));
                }
                _lastKnownUid = _uid;
                // Get real JWT 500ms after bundle finishes its own POST /api/me
                // Capture pending accessToken now (before the timeout fires and it may be cleared)
                var _pendingTok = window._wp_pendingAccessToken || null;
                if (_pendingTok) { window._wp_pendingAccessToken = null; }
                setTimeout(function() {
                  var _existTok = localStorage.getItem('workpro_token');
                  if (!_existTok || _existTok.length < 20 || _existTok.startsWith('pi_')) {
                    var _body = { uid: _uid, username: _u.username || '' };
                    if (_pendingTok) _body.accessToken = _pendingTok;
                    fetch(API + '/api/me', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify(_body)
                    }).then(function(r) { return r.ok ? r.json() : null; })
                      .then(function(d) { if (d && d.token) { _origSetItem('workpro_token', d.token); } })
                      .catch(function() {});
                  }
                }, 500);
              }
            } catch(e) {}
          }
        };
      })();

      // ── 2. Balance-connects sync: fetch real balance from API and save ────────
      function syncBalance() {
        var _su = null;
        try { _su = JSON.parse(localStorage.getItem('workpro_user') || 'null'); } catch(e) {}
        if (!_su) return; // not logged in
        var _suid = _su.uid || _su.id;
        if (!_suid) return;
        var _shdrs = { 'x-user-id': _suid };
        var _stok = localStorage.getItem('workpro_token');
        if (_stok) _shdrs['Authorization'] = 'Bearer ' + _stok;
        fetch(API + '/api/connects/balance', {
          headers: _shdrs
        }).then(function(r){ return r.ok ? r.json() : null; })
          .then(function(d){
            if (!d || d.balance === undefined) return;
            var bal = parseInt(d.balance, 10) || 0;
            // Update workpro_user.balance_connects
            try {
              var raw = localStorage.getItem('workpro_user');
              if (raw) {
                var u = JSON.parse(raw);
                if (u) {
                  u.balance_connects = bal;
                  // Use _rawSetItem to bypass avatar-sync interceptor
                  var _rsi = localStorage._origSetItem || localStorage.setItem.bind(localStorage);
                  _rsi('workpro_user', JSON.stringify(u));
                }
              }
            } catch(e) {}
            // Also update standalone connects key
            localStorage.setItem('workpro_connects', String(bal));
            // Dispatch storage event so React re-reads balance from localStorage
            try {
              window.dispatchEvent(new StorageEvent('storage', {
                key: 'workpro_user', storageArea: localStorage,
                newValue: localStorage.getItem('workpro_user')
              }));
              window.dispatchEvent(new StorageEvent('storage', {
                key: 'workpro_connects', storageArea: localStorage,
                newValue: String(bal)
              }));
            } catch(e) {}
          }).catch(function(){});
      }
      // Sync on startup (after auth fallback fires at ~3s) and every 30s
      setTimeout(syncBalance, 4000);
      setInterval(syncBalance, 30000);

      // ── 3. Hide "Apply Now" on own jobs ──────────────────────────────────────
      function getMyUsername() {
        try {
          var u = JSON.parse(localStorage.getItem('workpro_user') || 'null');
          return u ? (u.username || '') : '';
        } catch(e) { return ''; }
      }
      var _hideObs = new MutationObserver(function() {
        var me = getMyUsername();
        if (!me) return;
        // Find job cards/panels showing owner = me, then hide Apply button inside them
        document.querySelectorAll('button, div[role="button"], [class*="btn"], [class*="button"]').forEach(function(btn) {
          // Never hide Apply Now buttons we injected (those are for other users' open jobs)
          if (btn.getAttribute('data-wp-apply-fixed')) return;
          var txt = (btn.textContent || '').toLowerCase().trim();
          if (!/apply now|откликнуться|apply$/.test(txt)) return;
          // Walk up to find the job container and check author username
          var container = btn;
          for (var i = 0; i < 15; i++) {
            container = container && container.parentElement;
            if (!container) break;
            var html = container.innerHTML || '';
            // Look for author chip — usually displayed as username text
            if (html.indexOf(me) !== -1) {
              // Make sure this isn't just the header (profile area) — check job title sibling
              var hasJobTitle = container.querySelector('h2, h3, [class*="title"], [class*="job"]');
              if (hasJobTitle) {
                btn.style.display = 'none';
                btn.setAttribute('data-wp-hidden-own-job', '1');
                break;
              }
            }
          }
        });
      });
      if (document.body) {
        _hideObs.observe(document.body, { childList: true, subtree: true });
      } else {
        document.addEventListener('DOMContentLoaded', function() {
          _hideObs.observe(document.body, { childList: true, subtree: true });
        });

      // ── 3b. Fix Apply button on job detail: open jobs show "Job filled" due to
      // status remapping in the list. Store open job IDs and inject real Apply button.
      window._wp_openJobs = {}; // { id: {id, title, apply_cost} }
      // Pre-load all open jobs on startup (using real status endpoint)
      fetch(API + '/api/jobs?limit=50').then(function(r){ return r.ok ? r.json() : null; }).then(function(d) {
        // server returns _open:true for originally-open jobs
        if (d && d.jobs) {
          d.jobs.forEach(function(j) {
            if (j._open) window._wp_openJobs[j.id] = j;
          });
          
        }
      }).catch(function(){});
      // Populated by the jobs list interceptor (see above — we need to update that too)
      // Also patch the jobs list interceptor to populate this map:
      (function(){
        var _origResp = window._wp_openJobs;
        // Hook into the already-installed fetch wrapper to catch jobs list
        var _prevFetch = window.fetch;
        window.fetch = function(input, init) {
          var result = _prevFetch.apply(this, arguments);
          try {
            var u = typeof input === 'string' ? input : (input && input.url) || '';
            var isJobDetail = /\/api\/jobs\/(\d+)$/.test(u) && (!init || !init.method || init.method === 'GET');

              // Cache individual job open status

                  }
                  return resp;
                }).catch(function(){ return resp; });
              });
            }
          } catch(e) {}
          return result;
        };
      })();

      // Robust apply-cost: trust server apply_cost, else compute from budget (1-50π=1, 51-100π=2…)

        var c = parseInt(job && job.apply_cost, 10);
        if (c > 0) return c;
        var b = parseFloat(job && job.budget);
        if (b > 0) return Math.ceil(b / 50);
        return 1;
      }

        ok.style.cssText = 'flex:1;padding:12px;background:#10b981;color:#fff;border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;';

      // Fixed-position Apply Now overlay — outside React DOM, React can't remove it
      var _applyOverlay = null;
      function _showApplyOverlay(openJob) {

        var cost = _applyCostOf(openJob);
