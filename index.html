  <script>
  // Monkey-patch JSON.parse to fix v182 bundle compatibility issues
  (function() {
    var origParse = JSON.parse;
    JSON.parse = function(text, reviver) {
      var data = origParse.call(this, text, reviver);
      function fixJob(job) {
        if (!job || typeof job !== 'object') return job;
        // Fix null images -> [] (v182 expects array)
        if (job.images === null || job.images === undefined) {
          job.images = [];
        }
        // Fix null deadline -> '' (v182 expects string)
        if (job.deadline === null || job.deadline === undefined) {
          job.deadline = '';
        }
        // Add requirements if missing (v182 expects it)
        if (job.requirements === undefined) {
          job.requirements = job.description || job.message || '';
        }
        // Convert array skills -> string for v182
        if (Array.isArray(job.skills)) {
          job.skills = job.skills.join(',');
        }
        return job;
      }
      function fixUser(user) {
        if (!user || typeof user !== 'object') return user;
        if (Array.isArray(user.skills)) {
          user.skills = user.skills.join(',');
        }
        return user;
      }
      if (data && typeof data === 'object') {
        // Single job object
        if (data.id !== undefined && data.title !== undefined) {
          fixJob(data);
        }
        // Array of jobs
        if (Array.isArray(data)) {
          data.forEach(function(item) {
            if (item && item.id !== undefined && item.title !== undefined) {
              fixJob(item);
            }
          });
        }
        // Jobs wrapper
        if (data.jobs && Array.isArray(data.jobs)) {
          data.jobs.forEach(fixJob);
        }
        // User object
        if (data.user && typeof data.user === 'object') {
          fixUser(data.user);
        }
        if (data.id !== undefined && data.username !== undefined) {
          fixUser(data);
        }
      }
      return data;
    };
  })();
  </script>

  // Monkey-patch Response.prototype.json() to fix v182 bundle compatibility
  (function() {
    var origJson = Response.prototype.json;
    Response.prototype.json = function() {
      return origJson.call(this).then(function(data) {
        function fixJob(job) {
          if (!job || typeof job !== 'object') return job;
          // Fix null images -> [] (v182 expects array)
          if (job.images === null || job.images === undefined) {
            job.images = [];
          }
          // Fix null deadline -> '' (v182 expects string)
          if (job.deadline === null || job.deadline === undefined) {
            job.deadline = '';
          }
          // Add requirements if missing (v182 expects it)
          if (job.requirements === undefined) {
            job.requirements = job.description || job.message || '';
          }
          // Convert array skills -> string for v182
          if (Array.isArray(job.skills)) {
            job.skills = job.skills.join(',');
          }
          return job;
        }
        function fixUser(user) {
          if (!user || typeof user !== 'object') return user;
          if (Array.isArray(user.skills)) {
            user.skills = user.skills.join(',');
          }
          return user;
        }
        function fixSkills(obj) {
          if (obj && Array.isArray(obj.skills)) obj.skills = obj.skills.join(',');
        }
        if (data && typeof data === 'object') {
          fixSkills(data);
          if (Array.isArray(data.jobs)) data.jobs.forEach(fixJob);
          if (Array.isArray(data.applications)) data.applications.forEach(fixSkills);
          if (Array.isArray(data.freelancers)) data.freelancers.forEach(fixSkills);
          if (Array.isArray(data)) data.forEach(function(item) {
            fixSkills(item);
            if (item && item.id !== undefined && item.title !== undefined) fixJob(item);
          });
          // Single job object
          if (data.id !== undefined && data.title !== undefined) {
            fixJob(data);
          }
          // User object
          if (data.user && typeof data.user === 'object') {
            fixUser(data.user);
          }
          if (data.id !== undefined && data.username !== undefined) {
            fixUser(data);
          }
        }
        return data;
      });
    };
  })();

  var STORAGE_KEY = 'workpro_user';

  var BALANCE_KEY = 'workpro_balance';
  var SIG_KEY = 'workpro_user_sig';
  var SECRET = 'workpro_v42_' + location.hostname;

  function hash(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
    return Math.abs(h).toString(36);

  var savedConnects = null, savedBalance = null;

  var origSetItem = localStorage.setItem;
  localStorage.setItem = function(key, val) {

          user.connects = storedC;

        origSetItem.call(localStorage, CONNECTS_KEY, String(finalC));

  var origRemoveItem = localStorage.removeItem;

        var user = JSON.parse(val);
        var sc = origGetItem.call(localStorage, CONNECTS_KEY);
        var storedC = parseInt(sc || '0', 10);
        var currentC = user.balance_connects || user.connects || 0;
        if (storedC > currentC && (storedC - currentC) > 5) {
          user.balance_connects = storedC;
          user.connects = storedC;

  // ─── BLOCK localStorage.clear() from wiping connects ──────────

      }

    for (var j = 0; j < keysToRemove.length; j++) {

  setInterval(function() {
    var userStr = localStorage.getItem(STORAGE_KEY);

  (function() {

  // ---- FIX: Clear Cache link routed by React Router -> direct HTML ----

    function compressImage(file, maxWidth, quality) {
      return new Promise(function(resolve, reject) {
        if (!file || !file.type || !file.type.startsWith('image/')) return resolve(file);
        var img = new Image();
        var url = URL.createObjectURL(file);
        img.onload = function() {
          URL.revokeObjectURL(url);
          var scale = Math.min(1, maxWidth / img.width);
          var w = Math.round(img.width * scale);
          var h = Math.round(img.height * scale);
          var canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          canvas.toBlob(function(blob) {
            if (!blob) return reject('compress fail');
            var reader = new FileReader();
            reader.onloadend = function() { resolve(reader.result); };
            reader.readAsDataURL(blob);
          }, 'image/jpeg', quality);
        };
        img.onerror = function() { URL.revokeObjectURL(url); reject('load fail'); };
        img.src = url;
      });
    }

    window.__workproCompressImage = compressImage;

    // Intercept all file inputs: compress before React sees them
    document.addEventListener('change', function(e) {
      var input = e.target;
      if (input.type !== 'file' || !input.accept || input.accept.indexOf('image') === -1) return;
      if (!input.files || !input.files[0]) return;
      // Skip if already processed (prevents infinite loop on re-dispatch)
      if (input.__workpro_compressed) { input.__workpro_compressed = false; return; }
      var file = input.files[0];
      if (file.size < 500 * 1024) return; // skip small files
      e.preventDefault();
      e.stopPropagation();
      input.__workpro_processing = true;
      compressImage(file, 1200, 0.6).then(function(dataUrl) {
        var byteString = atob(dataUrl.split(',')[1]);
        var mime = dataUrl.split(',')[0].split(':')[1].split(';')[0];
        var ab = new ArrayBuffer(byteString.length);
        var ia = new Uint8Array(ab);
        for (var i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
        var blob = new Blob([ab], {type: mime});
        var newFile = new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), {type: 'image/jpeg'});
        var dt = new DataTransfer();
        dt.items.add(newFile);
        input.files = dt.files;
        input.__workpro_compressed = true;
        input.__workpro_processing = false;
        // Re-dispatch change so React picks up compressed file
        input.dispatchEvent(new Event('change', {bubbles: true}));
      }).catch(function(err) {
        input.__workpro_processing = false;
        console.error('[WorkPro] compress error:', err);
      });
    }, true);
  })();
