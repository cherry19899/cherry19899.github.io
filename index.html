  // Monkey-patch JSON.parse to fix v182 bundle compatibility issues
  (function() {
    var origParse = JSON.parse;
    JSON.parse = function(text, reviver) {
      var data = origParse.call(this, text, reviver);
      function fixJob(job) {
        if (!job || typeof job !== 'object') return job;
        // Fix null images -> [] (v182 expects array)
        if (job.images === null || job.images === undefined) {
          job.images = [];
        }
        // Fix null deadline -> '' (v182 expects string)
        if (job.deadline === null || job.deadline === undefined) {
          job.deadline = '';
        }
        // Add requirements if missing (v182 expects it)
        if (job.requirements === undefined) {
          job.requirements = job.description || job.message || '';
        }
        // Convert array skills -> string for v182
        if (Array.isArray(job.skills)) {
          job.skills = job.skills.join(',');
        }
        return job;
      }
      function fixUser(user) {
        if (!user || typeof user !== 'object') return user;
        if (Array.isArray(user.skills)) {
          user.skills = user.skills.join(',');
        }
        return user;
      }
      if (data && typeof data === 'object') {
        // Single job object
        if (data.id !== undefined && data.title !== undefined) {
          fixJob(data);
        }
        // Array of jobs
        if (Array.isArray(data)) {
          data.forEach(function(item) {
            if (item && item.id !== undefined && item.title !== undefined) {
              fixJob(item);
            }
          });
        }
        // Jobs wrapper
        if (data.jobs && Array.isArray(data.jobs)) {
          data.jobs.forEach(fixJob);
        }
        // User object
        if (data.user && typeof data.user === 'object') {
          fixUser(data.user);
        }
        if (data.id !== undefined && data.username !== undefined) {

      function urlBase64ToUint8Array(base64String) {
        var padding = '='.repeat((4 - base64String.length % 4) % 4);

      // Helper: show toast notification (non-blocking)
      function showToast(message, color) {
        color = color || '#10b981';
        var toastId = '_wp_toast_' + Date.now();
        var toast = document.createElement('div');
        toast.id = toastId;
        toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:100000;background:#fff;border-left:4px solid ' + color + ';color:#374151;padding:12px 20px;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,0.15);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;max-width:90vw;width:auto;animation:slideDownToast 0.3s ease; display:flex; align-items:center; gap:8px;';
        toast.innerHTML = '<span style="color:' + color + ';font-size:18px;">&#10003;</span>' + message;
        document.body.appendChild(toast);
        setTimeout(function() {
          var t = document.getElementById(toastId);
          if (t) { t.style.opacity = '0'; t.style.transition = 'opacity 0.5s'; setTimeout(function() { t.remove(); }, 500); }
        }, 2500);
      }
      // Inject toast animation CSS
      var toastStyle = document.createElement('style');
      toastStyle.textContent = '@keyframes slideDownToast{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}';
      document.head.appendChild(toastStyle);

      }

          } else if (type === 'select') {
            input = document.createElement('select');

              ['translate', t.translate || 'Translate'], ['data', t.data || 'Data'],
              ['va', t.va || 'VA'], ['other', t.other || 'Other']
            ];
            cats.forEach(function(c) {
              var opt = document.createElement('option');
              opt.value = c[0];
              opt.textContent = c[1];
              input.appendChild(opt);
            });
          } else if (type === 'date') {
            input = document.createElement('input');
            input.type = 'date';
            input.style.cssText = 'width:100%;padding:10px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;box-sizing:border-box;';

            tomorrow.setDate(tomorrow.getDate() + 7);
            input.value = tomorrow.toISOString().split('T')[0];
          } else {
            input = document.createElement('input');
            input.type = type;
            input.style.cssText = 'width:100%;padding:10px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;box-sizing:border-box;';
          }
          if (ph) input.placeholder = ph;
          if (required) input.required = true;
          wrap.appendChild(input);
          return { wrap: wrap, input: input };
        }

        var titleField = makeField(t.titleLabel, 'text', t.titlePh, true);

        btnWrap.appendChild(closeBtn);
        btnWrap.appendChild(postBtn);
        box.appendChild(btnWrap);
        overlay.appendChild(box);
        document.body.appendChild(overlay);

        postBtn.onclick = function() {
          var title = titleField.input.value.trim();
          var desc = descField.input.value.trim();
          var cat = catField.input.value;
          var budget = parseInt(budgetField.input.value) || 0;
          var skills = skillsField.input.value.trim();
          var deadline = deadlineField.input.value;

          if (!title) { errorMsg.textContent = t.required; errorMsg.style.display = 'block'; return; }
          if (budget < 1) { errorMsg.textContent = t.budgetMin; errorMsg.style.display = 'block'; return; }

          errorMsg.style.display = 'none';
          postBtn.textContent = t.posting;
          postBtn.disabled = true;
          postBtn.style.opacity = '0.6';

          var uid = localStorage.getItem('workpro_user_id') || 'browser_user';
          var body = {
            title: title,
            description: desc,
            category: cat,
            budget: budget,
            skills: skills,
            deadline: deadline,
            requirements: desc
          };

          fetch('https://workpro-api.onrender.com/api/jobs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-user-id': uid },
            body: JSON.stringify(body)
          }).then(function(r) { return r.json(); }).then(function(data) {
            if (data.error) {
              errorMsg.textContent = t.error + data.error;
              errorMsg.style.display = 'block';
              postBtn.textContent = t.post;
              postBtn.disabled = false;
              postBtn.style.opacity = '1';

              if (window.showToast) window.showToast(t.success, '#10b981');
              // Refresh jobs list
              setTimeout(function() { window.location.reload(); }, 1500);

          }).catch(function(err) {
            errorMsg.textContent = t.error + 'Network error';
            errorMsg.style.display = 'block';
            postBtn.textContent = t.post;
            postBtn.disabled = false;
            postBtn.style.opacity = '1';
          });
        };

        console.log('[PostJob] Real form opened, lang=' + lang);

    <script>
    (function(){
      // Bootstrap: register user + give connects on first login
      var API = 'https://workpro-api.onrender.com';
      var BOOTSTRAP_KEY = '_wp_connects_bootstrapped_v2';

      function registerAndBootstrap(uid, username) {
        if (!uid) return;
        var bootstrapKey = BOOTSTRAP_KEY + '_' + uid;
        if (localStorage.getItem(bootstrapKey)) return;

        // Step 1: Register user in backend DB (upsert)
        fetch(API + '/api/me', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uid: uid, username: username || uid.replace(/^pi_/, '') })
        }).catch(function(){});

        // Step 2: Check balance and grant connects if < 10
        fetch(API + '/api/connects/balance', {
          headers: { 'x-user-id': uid }
        }).then(function(r){ return r.json(); }).then(function(d){
          var bal = d.balance != null ? d.balance : (d.balance_connects != null ? d.balance_connects : 0);
          if (bal < 10) {
            // Direct connects grant (no Pi payment needed for initial onboarding)
            fetch(API + '/api/connects/buy', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'x-user-id': uid },
              body: JSON.stringify({ quantity: 50, status: 'granted' })
            }).then(function(r){ return r.json(); }).then(function(d){
              if (d.success) {
                // Mark bootstrap done only after successful grant
                localStorage.setItem(bootstrapKey, '1');
                var newBal = d.new_balance || d.balance || 50;
                // Update localStorage connects
                try {
                  var stored = localStorage.getItem('workpro_user');
                  if (stored) {
                    var u = JSON.parse(stored);
                    u.balance_connects = newBal;
                    u.connects = newBal;
                    localStorage.setItem('workpro_user', JSON.stringify(u));
                    localStorage.setItem('workpro_connects', String(newBal));
                  }
                } catch(e) {}
              }
            }).catch(function(){});
            // Note: bootstrapKey NOT set here — will retry if server was unreachable
          }
        }).catch(function(){});
      }

      // Watch for user login via localStorage.setItem
      var origSetItem = localStorage.setItem.bind(localStorage);
      localStorage.setItem = function(key, value) {
        origSetItem(key, value);
        if (key === 'workpro_user') {
          try {
            var u = JSON.parse(value);
            var uid = u.id || u.uid;
            if (uid) {
              window._workproUser = u;
              // Keep workpro_user_id in sync for legacy inline code
              origSetItem('workpro_user_id', uid);
              registerAndBootstrap(uid, u.username || u.name);
            }
          } catch(e) {}
        }
      };

      // Also check on load if already logged in
      try {
        var stored = localStorage.getItem('workpro_user');
        if (stored) {
          var u = JSON.parse(stored);
          var uid = u.id || u.uid;
          if (uid) {
            window._workproUser = u;
            registerAndBootstrap(uid, u.username || u.name);
          }
        }
      } catch(e) {}

      console.log('[v512] User bootstrap watcher ready (v2)');
    })();
