<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work Pro - Pi Network Freelance Marketplace</title>
  <script>window.WORKPRO_VERSION='v259';</script>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* [CSS truncated for brevity - same as before] */
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="src/utils.js"></script>
  <script src="src/api.js"></script>
  <script src="src/components/Auth.js"></script>
  <script src="src/components/Navbar.js"></script>
  <script src="src/components/Home.js"></script>
  <script src="src/components/JobList.js"></script>
  <script src="src/components/JobDetail.js"></script>
  <script src="src/components/CreateJob.js"></script>
  <script src="src/components/MyJobs.js"></script>
  <script src="src/components/Chat.js"></script>
  <script src="src/components/ChatRoom.js"></script>
  <script src="src/components/Escrow.js"></script>
  <script src="src/components/Profile.js"></script>
  <script src="src/components/Connects.js"></script>
  <script src="src/components/Applications.js"></script>
  <script src="src/components/Reviews.js"></script>
  <script src="src/components/Portfolio.js"></script>
  <script src="src/components/Admin.js"></script>
  <script src="src/App.js"></script>

  <script>
    (function() {
      var attempts = 0;
      function mount() {
        attempts++;
        if (typeof App === 'undefined') {
          if (attempts < 50) {
            setTimeout(mount, 100);
          }
          return;
        }
        var root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
          setTimeout(mount, 200);
        });
      } else {
        setTimeout(mount, 200);
      }
    })();
  </script>

  <div id="__cw" style="position:fixed;bottom:0;left:0;right:0;z-index:99998;display:none;">
    <div id="__ct" style="background:#0d9488;color:#fff;font-size:10px;padding:2px 6px;cursor:pointer;font-family:monospace;text-align:center;" onclick="var c=document.getElementById('__c'),t=document.getElementById('__ct');if(c.style.display==='none'){c.style.display='block';t.textContent='▼ Console'}else{c.style.display='none';t.textContent='▲ Console'}">▼ Console</div>
    <div id="__c" style="max-height:100px;overflow-y:auto;background:rgba(0,0,0,.85);color:#0f0;font-family:monospace;font-size:10px;line-height:1.4;padding:6px;display:block;border-top:2px solid #0f0;"></div>
  </div>
  <script>
    (function() {
      var c = document.getElementById('__c'), cw = document.getElementById('__cw'), cnt = 0;
      function lg(t, m) {
        if (!c || !cw) return;
        cnt++;
        if (cnt > 80) return;
        cw.style.display = 'block';
        c.style.display = 'block';
        var d = document.createElement('div');
        d.style.color = t;
        d.textContent = m;
        c.appendChild(d);
      }
      lg('#0f0', '[WP] v259 start');
      var o = console.log, oe = console.error, ow = console.warn;
      console.log = function() {
        var a = Array.prototype.slice.call(arguments).join(' ');
        o.apply(console, arguments);
        lg('#0f0', '[L] ' + a);
      };
      console.error = function() {
        var a = Array.prototype.slice.call(arguments).join(' ');
        oe.apply(console, arguments);
        lg('#f00', '[E] ' + a);
      };
      console.warn = function() {
        var a = Array.prototype.slice.call(arguments).join(' ');
        if (a.indexOf('already initialized') > -1) return;
        ow.apply(console, arguments);
        lg('#ff0', '[W] ' + a);
      };
      window.onerror = function(m, u, l, co, err) {
        lg('#f00', '[ERR] ' + m + ' @' + l + ':' + co);
        return true;
      };
      window.onunhandledrejection = function(e) {
        var r = e.reason || e, msg = r && r.message ? r.message : String(r);
        lg('#f00', '[REJ] ' + msg);
      };
    })();
  </script>
</body>
</html>
