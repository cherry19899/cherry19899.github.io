      function tryInit() {

    // ---- PI SDK AUTH PATCH (must run BEFORE bundle) ----
    (function() {
      function patchAuth() {
        if (!window.Pi || typeof window.Pi.authenticate !== 'function') {
          setTimeout(patchAuth, 50);
          return;
        }
        var origAuth = window.Pi.authenticate;
        window.Pi.authenticate = function(scopes, onIncompletePaymentFound) {
          // FORCE payments scope — required for Pi.createPayment to work
          if (!scopes || !Array.isArray(scopes)) scopes = ['username', 'payments'];
          if (scopes.indexOf('payments') === -1 && scopes.indexOf('payment') === -1) {
            scopes = scopes.concat(['payments']);
            console.log('[Pi] Added payments scope to auth request');
          }
          // onIncompletePaymentFound: handles incomplete payments per Pi SDK spec.
          // SDK docs: "you should most likely send the payment DTO to your server,
          // and process it according to your business logic".
          var wrapped = function(payment) {
            console.log('[Pi] onIncompletePaymentFound:', payment);
            var paymentId = payment.identifier || payment.paymentId || payment.id || '';
            if (!paymentId) {
              console.warn('[Pi] No payment identifier found in:', payment);
              return Promise.resolve();
            }
            // Send FULL payment DTO to backend so it can decide: complete or cancel
            var userStr = localStorage.getItem('workpro_user');
            var userId = '';
            try { if (userStr) userId = JSON.parse(userStr).uid || JSON.parse(userStr).id || ''; } catch(e){}
            if (!userId && payment && payment.user_uid) userId = payment.user_uid;
            if (!userId && payment && payment.userUid) userId = payment.userUid;
            return fetch('https://workpro-api.onrender.com/api/payments/' + encodeURIComponent(paymentId) + '/incomplete', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-user-id': userId || 'unknown'
              },
              body: JSON.stringify({ payment: payment })
            }).then(function(r) {
              console.log('[Pi] Incomplete payment handled:', paymentId, r.status);
              return Promise.resolve();
            }).catch(function(err) {
              console.warn('[Pi] Incomplete payment handle failed, resolving anyway:', err.message);
              return Promise.resolve();
            });
          };
          var result = origAuth.call(window.Pi, scopes, wrapped);
          // Store userId globally for createPayment proxy
          if (result && typeof result.then === 'function') {
            result.then(function(authResult) {
              if (authResult && authResult.user) {
                var uid = authResult.user.uid || authResult.user.id;
                if (uid) {
                  window._workproUserId = uid;
                  // Save to localStorage for fetch interceptor
                  var userToStore = {
                    id: uid,
                    uid: uid,
                    username: authResult.user.username || authResult.user.name || 'User',
                    name: authResult.user.name || authResult.user.username || 'User',
                    accessToken: authResult.accessToken || '',
                    balance_connects: authResult.user.balance_connects || 0
                  };
                  localStorage.setItem('workpro_user', JSON.stringify(userToStore));
                  localStorage.setItem('workpro_user_id', uid);
                  console.log('[Pi] User stored:', uid, userToStore.username);
                }
              }
            }).catch(function(err) { console.warn('[Pi] Auth storage error:', err); });
          }
          return result;
        };
        console.log('[Pi] authenticate patched with Promise wrapper + userId storage');
      }
      patchAuth();

  (function() {

        function wrapCallback(cb, name) {

(function() {

  (function() {

            headers: {'Content-Type': 'application/json'}
          });
        }).catch(function() { return response; });
      }

      var clone = response.clone();

          } catch(e) {}

          if (el) el.textContent = data.remaining_connects;

        // ─── Handle connects purchase new_balance ──────────────────

            var userStr = localStorage.getItem('workpro_user');
            if (userStr) {

              user.connects = data.new_balance;

  // ---- 3b. XMLHTTPREQUEST INTERCEPTOR (bundle uses XHR, not fetch) ----
  (function() {
    var OrigXHR = window.XMLHttpRequest;
    function InterceptedXHR() {
      var xhr = new OrigXHR();
      var _open = xhr.open;
      var _setHeader = xhr.setRequestHeader;
      var _url = '';
      var _headers = {};

      xhr.open = function(method, url) {
        _url = url;
        return _open.apply(xhr, arguments);
      };

      xhr.setRequestHeader = function(name, value) {
        _headers[name.toLowerCase()] = value;
        return _setHeader.apply(xhr, arguments);
      };

      // Intercept send to inject x-user-id for API calls
      var _send = xhr.send;
      xhr.send = function(body) {
        if (_url.indexOf('/api/') !== -1 && !_headers['x-user-id'] && !_headers['x-user-id']) {
          try {
            var userStr = localStorage.getItem('workpro_user');
            if (userStr) {
              var user = JSON.parse(userStr);
              var uid = user.id || user.uid;
              if (uid) _setHeader.call(xhr, 'x-user-id', uid);
            }
          } catch(e) {}
        }
        return _send.apply(xhr, arguments);
      };

      return xhr;
    }
    window.XMLHttpRequest = InterceptedXHR;

  // ---- 4. CONNECTS PROTECTION ----
  var STORAGE_KEY = 'workpro_user';
  var CONNECTS_KEY = 'workpro_connects';
  var BALANCE_KEY = 'workpro_balance';
  var SIG_KEY = 'workpro_user_sig';
  var SECRET = 'workpro_v42_' + location.hostname;

  function hash(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
    return Math.abs(h).toString(36);
  }
  function sign(s) { return hash(s + SECRET); }

  var savedConnects = null, savedBalance = null;
  try {
    var sc = localStorage.getItem(CONNECTS_KEY);
    var sb = localStorage.getItem(BALANCE_KEY);
    if (sc) savedConnects = parseInt(sc, 10);
    if (sb) savedBalance = parseInt(sb, 0);
  } catch(e) {}

  var origSetItem = localStorage.setItem;
  localStorage.setItem = function(key, val) {
    if (key === STORAGE_KEY && val) {
      try {
        var user = JSON.parse(val);
        var sc = origGetItem.call(localStorage, CONNECTS_KEY);
        var storedC = parseInt(sc || '0', 10);
        var currentC = user.balance_connects || user.connects || 0;
        var currentB = user.balance_pi || 0;
        // If stored connects differ from what is being written, use stored value (truth)
        if (storedC >= 0 && storedC !== currentC) {
          console.log('[WorkPro] BLOCKED server reset, restoring:', storedC, 'vs', currentC);
          user.balance_connects = storedC;
          user.connects = storedC;
          currentC = storedC;
          val = JSON.stringify(user);
        }
        var finalC = user.balance_connects || user.connects || 0;
        var finalB = user.balance_pi || 0;
        origSetItem.call(localStorage, CONNECTS_KEY, String(finalC));
        origSetItem.call(localStorage, BALANCE_KEY, String(finalB));
        origSetItem.call(localStorage, SIG_KEY, sign(val));
      } catch(e) {}
    }
    return origSetItem.call(localStorage, key, val);
  };

  var origRemoveItem = localStorage.removeItem;
  localStorage.removeItem = function(key) {
    if (key === CONNECTS_KEY || key === BALANCE_KEY || key === SIG_KEY) {
      console.log('[WorkPro] BLOCKED remove:', key);
      return;
    }
    if (key === STORAGE_KEY) {
      var sc = origGetItem.call(localStorage, CONNECTS_KEY);
      if (sc) savedConnects = parseInt(sc, 10);
      console.log('[WorkPro] Logout, keeping connects:', savedConnects);
      try {
        var userStr = origGetItem.call(localStorage, key);
        if (userStr) {
          var user = JSON.parse(userStr);
          user.pi_token = null;
          origSetItem.call(localStorage, key, JSON.stringify(user));
          return;
        }
      } catch(e) {}
    }
    return origRemoveItem.call(localStorage, key);
  };

  var origGetItem = localStorage.getItem;
  localStorage.getItem = function(key) {
    var val = origGetItem.call(localStorage, key);
    if (key === STORAGE_KEY && val) {
      try {
        var user = JSON.parse(val);
        var sc = origGetItem.call(localStorage, CONNECTS_KEY);
        var storedC = parseInt(sc || '0', 10);
        var currentC = user.balance_connects || user.connects || 0;
        if (storedC > currentC && (storedC - currentC) > 5) {
          user.balance_connects = storedC;
          user.connects = storedC;
          val = JSON.stringify(user);
        }
        return val;
      } catch(e) {}
    }
    return val;
  };

  // ─── BLOCK localStorage.clear() from wiping connects ──────────
  var origClear = localStorage.clear;
  localStorage.clear = function() {
    var sc = origGetItem.call(localStorage, CONNECTS_KEY);
    var sb = origGetItem.call(localStorage, BALANCE_KEY);
    console.log('[WorkPro] BLOCKED clear, preserving connects:', sc);
    var keysToRemove = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k !== CONNECTS_KEY && k !== BALANCE_KEY && k !== SIG_KEY) {
        keysToRemove.push(k);
      }
    }
    for (var j = 0; j < keysToRemove.length; j++) {
      origRemoveItem.call(localStorage, keysToRemove[j]);
    }
    if (sc) origSetItem.call(localStorage, CONNECTS_KEY, sc);
    if (sb) origSetItem.call(localStorage, BALANCE_KEY, sb);
  };

  setInterval(function() {
    var userStr = localStorage.getItem(STORAGE_KEY);
    var sc = localStorage.getItem(CONNECTS_KEY);
    if (userStr && sc) {
      try {
        var user = JSON.parse(userStr);
        var stored = parseInt(sc, 10);
        var current = user.balance_connects || user.connects || 0;
        if (stored > current && (stored - current) > 5) {
          user.balance_connects = stored;
          user.connects = stored;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(user));
        }
      } catch(e) {}
    }
  }, 1000);

  // ---- 5. PHOTO COMPRESSION ----
  (function() {
    function compressImage(file, maxWidth, quality) {
      return new Promise(function(resolve, reject) {
        if (!file || !file.type || !file.type.startsWith('image/')) return resolve(file);
        var img = new Image();
        var url = URL.createObjectURL(file);
        img.onload = function() {
          URL.revokeObjectURL(url);
          var scale = Math.min(1, maxWidth / img.width);
          var w = Math.round(img.width * scale);
          var h = Math.round(img.height * scale);
          var canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          canvas.toBlob(function(blob) {
            if (!blob) return reject('compress fail');
            var reader = new FileReader();
            reader.onloadend = function() { resolve(reader.result); };
            reader.readAsDataURL(blob);
          }, 'image/jpeg', quality);
        };
        img.onerror = function() { URL.revokeObjectURL(url); reject('load fail'); };
        img.src = url;
      });
    }

    window.__workproCompressImage = compressImage;

    // Intercept all file inputs: compress before React sees them
    document.addEventListener('change', function(e) {
      var input = e.target;
      if (input.type !== 'file' || !input.accept || input.accept.indexOf('image') === -1) return;
      if (!input.files || !input.files[0]) return;
      // Skip if already processed (prevents infinite loop on re-dispatch)
      if (input.__workpro_compressed) { input.__workpro_compressed = false; return; }
      var file = input.files[0];
      if (file.size < 500 * 1024) return; // skip small files
      e.preventDefault();
      e.stopPropagation();
      input.__workpro_processing = true;
      compressImage(file, 1200, 0.6).then(function(dataUrl) {
        var byteString = atob(dataUrl.split(',')[1]);
        var mime = dataUrl.split(',')[0].split(':')[1].split(';')[0];
        var ab = new ArrayBuffer(byteString.length);
        var ia = new Uint8Array(ab);
        for (var i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
        var blob = new Blob([ab], {type: mime});
        var newFile = new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), {type: 'image/jpeg'});
        var dt = new DataTransfer();
        dt.items.add(newFile);
        input.files = dt.files;
        input.__workpro_compressed = true;
        input.__workpro_processing = false;
        // Re-dispatch change so React picks up compressed file
        input.dispatchEvent(new Event('change', {bubbles: true}));
      }).catch(function(err) {
        input.__workpro_processing = false;
        console.error('[WorkPro] compress error:', err);
      });
    }, true);
  })();

  console.log('[WorkPro] Patch v47 loaded (with photo compression)');

  // ---- AUTO DEV LOGIN FALLBACK (for non-Pi browsers) ----
  window.__workproPiAuth = function() {
    return new Promise(function(resolve, reject) {
      // Detect sandbox mode: Pi Browser has PiBrowser in UA, sandbox mode does not
      var isSandbox = !(window.navigator && window.navigator.userAgent && window.navigator.userAgent.indexOf('PiBrowser') !== -1);
      
      if (isSandbox || !window.Pi || typeof window.Pi.authenticate !== 'function') {
        console.warn('[Pi] Sandbox or SDK not available, using dev login');
        var devUser = { id: 'test_user_123', uid: 'test_user_123', username: 'Dev_test_use', name: 'Dev Test', accessToken: 'dev_token', balance_connects: 10, availability: 'available' };
        localStorage.setItem('workpro_user', JSON.stringify(devUser));
        localStorage.setItem('workpro_pi_token', 'dev_token');
        localStorage.setItem('__workpro_dev_mode', 'true');
        resolve({ user: devUser, accessToken: 'dev_token' });
        return;
      }

      // Real Pi Browser: call authenticate with timeout guard
      var authTimeout = setTimeout(function() {
        console.warn('[Pi] authenticate timed out, forcing dev login');
        var devUser = { id: 'test_user_123', uid: 'test_user_123', username: 'Dev_test_use', name: 'Dev Test', accessToken: 'dev_token', balance_connects: 10, availability: 'available' };
        localStorage.setItem('workpro_user', JSON.stringify(devUser));
        localStorage.setItem('workpro_pi_token', 'dev_token');
        localStorage.setItem('__workpro_dev_mode', 'true');
        resolve({ user: devUser, accessToken: 'dev_token' });
      }, 8000);

      // Correct onIncompletePaymentFound per Pi SDK spec: must handle incomplete payment
      window.Pi.authenticate(['username', 'payments'], function(payment) {
        console.log('[Pi] onIncompletePaymentFound (dev fallback):', payment);
        var paymentId = payment && (payment.identifier || payment.paymentId || payment.id);
        if (paymentId) {
          fetch('https://workpro-api.onrender.com/api/payments/' + paymentId + '/incomplete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ payment: payment })
          }).catch(function(){});
        }
        return Promise.resolve();
      }).then(function(authResult) {
        clearTimeout(authTimeout);
        if (authResult && authResult.user) {
          var uid = authResult.user.uid || authResult.user.id;
          var user = { id: uid, uid: uid, username: authResult.user.username || 'User', name: authResult.user.username || 'User', accessToken: authResult.accessToken || '', balance_connects: authResult.user.balance_connects || 0 };
          localStorage.setItem('workpro_user', JSON.stringify(user));
          localStorage.setItem('workpro_pi_token', authResult.accessToken || '');
        }
        resolve(authResult);
      }).catch(function(err) {
        clearTimeout(authTimeout);
        reject(err);
      });
    });
  };

    // ---- AVAILABILITY TOGGLE ----
  window.__workproToggleAvailability = function() {
    var userStr = localStorage.getItem('workpro_user');
    if (!userStr) return alert('Please sign in first');
    var user = JSON.parse(userStr);
    var current = user.availability || 'available';

  // ---- 6. YOUR JOBS PANEL (v122) ----
  (function() {

    else document.addEventListener('DOMContentLoaded', mount);
    
    function loadMyJobs() {
      fetch('https://workpro-api.onrender.com/api/jobs/me', { headers: {'x-user-id': USER_ID} })

    // ---- DYNAMIC APPLY COST: update button text based on job budget ----
    function updateApplyCosts() {
      var cards = document.querySelectorAll('div[class*="rounded-xl"], div[class*="bg-card"]');
      cards.forEach(function(card) {
        var cardText = card.innerText || card.textContent || '';
        var budgetMatch = cardText.match(/(\d+(?:\.\d+)?)\s*π/);
        if (!budgetMatch) return;
        var budget = parseFloat(budgetMatch[1]);
        var cost = Math.ceil(budget / 50) || 1;
        var btns = card.querySelectorAll('button');
        btns.forEach(function(btn) {
          var txt = btn.textContent || '';
          if (txt.match(/Apply|Отклик|Postuler|Bewerben/i) && txt.match(/connects|коннект|Verbindung|Connexion/i)) {

            var currentCost = txt.match(/(\d+)/);
            if (!currentCost || parseInt(currentCost[1]) !== cost) {

            }
          }
        });

        if (isOwnJob || hasOwnerBadge) {

            var txt = btn.textContent || '';
            if (txt.match(/Отклик|Apply|Bewerben|Postuler/i)) {
              btn.style.display = 'none';
            }
          });
        }
      }
    }, 500);
  })();

        <div id="admin-log" style="background:#0f172a;border-radius:8px;padding:10px;font-family:monospace;font-size:11px;color:#94a3b8;max-height:150px;overflow-y:auto;line-height:1.5;"></div>
      </div>
    </div>
    <button id="admin-toggle" style="display:none;position:fixed;top:10px;right:10px;background:#0ea5e9;color:#fff;border:none;border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer;z-index:10000;box-shadow:0 4px 12px rgba(14,165,233,0.4);align-items:center;justify-content:center;">⚡</button>
    <div id="root"></div>
    <!-- Privacy Policy Link (required for Pi Network listing) -->
  <script>
  (function() {
    var ppLink = document.createElement('a');
    ppLink.href = '/privacy-policy.html';
    ppLink.id = 'privacy-policy-link';
    ppLink.style.cssText = 'position:fixed;bottom:10px;right:10px;color:#64748b;font-size:12px;z-index:9999;text-decoration:none;opacity:0.7;';
    ppLink.textContent = 'Privacy Policy';
    document.body.appendChild(ppLink);
  })();
  </script>
  <!-- Admin Panel Logic -->
  <script>
  (function() {
    var API = 'https://workpro-api.onrender.com';
    var adminPanel = document.getElementById('admin-panel');
    var adminToggle = document.getElementById('admin-toggle');
    var adminStats = document.getElementById('admin-stats');
    var adminLog = document.getElementById('admin-log');
    var logLines = [];

    function log(msg) {
      var t = new Date().toLocaleTimeString();
      logLines.push('[' + t + '] ' + msg);
      if (logLines.length > 50) logLines.shift();
      if (adminLog) adminLog.textContent = logLines.join('\n');
    }

    var _adminChecks = 0;
    function checkAdmin() {
      _adminChecks++;
      if (_adminChecks > 20) { return; } // Stop after ~60s
      try {
        var userStr = localStorage.getItem('workpro_user');
        if (_adminChecks <= 2) {
          console.log('[Admin] Checking admin, userStr:', userStr ? 'found' : 'missing');
        }
        if (!userStr) { setTimeout(checkAdmin, 3000); return; }
        var user = JSON.parse(userStr);
        var username = (user.username || '').toLowerCase();
        console.log('[Admin] Username:', username, 'is_admin:', user.is_admin);
        if (user && (username === 'cherry19899' || username === 'admin' || user.is_admin)) {
          adminToggle.style.display = 'flex';
          log('Admin: ' + user.username);
          loadStats();
        } else {
          console.log('[Admin] Not admin');
        }
      } catch(e) { if (_adminChecks <= 3) console.error('[Admin] check error:', e); setTimeout(checkAdmin, 3000); }
    }

    function loadStats() {
      fetch(API + '/api/admin/stats').then(function(r) { return r.json(); }).then(function(data) {
        if (data.error) { log('Stats: ' + data.error); return; }
        adminStats.innerHTML =
          '<div style="background:#0f172a;border-radius:8px;padding:8px;text-align:center;"><div style="font-size:18px;font-weight:700;color:#38bdf8;">' + (data.total_users || 0) + '</div><div style="font-size:11px;color:#94a3b8;">Users</div></div>' +
          '<div style="background:#0f172a;border-radius:8px;padding:8px;text-align:center;"><div style="font-size:18px;font-weight:700;color:#38bdf8;">' + (data.total_jobs || 0) + '</div><div style="font-size:11px;color:#94a3b8;">Jobs</div></div>' +
          '<div style="background:#0f172a;border-radius:8px;padding:8px;text-align:center;"><div style="font-size:18px;font-weight:700;color:#38bdf8;">' + (data.total_applications || 0) + '</div><div style="font-size:11px;color:#94a3b8;">Applications</div></div>' +
          '<div style="background:#0f172a;border-radius:8px;padding:8px;text-align:center;"><div style="font-size:18px;font-weight:700;color:#38bdf8;">' + (data.total_escrows || 0) + '</div><div style="font-size:11px;color:#94a3b8;">Escrows</div></div>';
        log('Stats OK');
      }).catch(function(e) { log('Stats err: ' + e.message); });
    }

    if (adminToggle) {
      adminToggle.addEventListener('click', function() {
        adminPanel.style.display = adminPanel.style.display === 'none' ? 'block' : 'none';
        if (adminPanel.style.display === 'block') loadStats();
      });
    }
    if (document.getElementById('admin-close')) {
      document.getElementById('admin-close').addEventListener('click', function() { adminPanel.style.display = 'none'; });
    }
    if (document.getElementById('admin-deploy')) {
      document.getElementById('admin-deploy').addEventListener('click', function() {
        log('Deploying backend...');
        fetch('https://api.render.com/deploy/srv-d7qvgf7lk1mc73cri1ng?key=X88S-SyFKag', { method: 'POST' })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.deploy && data.deploy.id) log('✅ Deploy triggered!');
            else log('❌ Failed: ' + JSON.stringify(data).slice(0, 80));
          })
          .catch(function(e) { log('❌ Error: ' + e.message); });
      });
    }
    if (document.getElementById('admin-refresh')) {
      document.getElementById('admin-refresh').addEventListener('click', function() { loadStats(); log('Refreshed'); });
    }
    if (document.getElementById('admin-cancel-pending')) {
      document.getElementById('admin-cancel-pending').addEventListener('click', function() {
        log('Cancelling pending payments...');
        fetch(API + '/api/payments/cancel-all-pending', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-user-id': 'cherry19899' } })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.success) log('✅ Cancelled: ' + JSON.stringify(data.results || 'OK'));
            else log('❌ Error: ' + JSON.stringify(data).slice(0, 80));
          })
          .catch(function(e) { log('❌ Err: ' + e.message); });
      });
    }

    log('Admin ready');
    setTimeout(checkAdmin, 2000);
  })();
  </script>
</body>
</html>
