  <!-- Babel Standalone for JSX transform -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ========================
       CSS RESET & BASE STYLES
       ======================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #7B3FE4;
      --primary-dark: #6432BC;
      --primary-light: #9B6AED;
      --secondary: #6C5CE7;
      --accent: #00D2D3;
      --success: #27ae60;
      --danger: #e74c3c;
      --warning: #f39c12;
      --bg: #f7f9fc;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --radius: 12px;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 4px 24px rgba(0, 0, 0, 0.12);
      --nav-height: 64px;
    }

    html, body, #root {
      height: 100%;
      min-height: 100vh;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ========================
       APP LAYOUT
       ======================== */
    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
      padding-top: var(--nav-height);
    }

    /* ========================
       NAVBAR
       ======================== */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: #fff;
      z-index: 1000;
      box-shadow: var(--shadow-lg);
    }

    .navbar-container {
      max-width: 1200px;
      margin: 0 auto;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 1.3rem;
    }

    .brand-icon {
      font-size: 1.6rem;
    }

    .navbar-links {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      justify-content: center;
    }

    .nav-link {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
      cursor: pointer;
      position: relative;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
    }

    .nav-badge {
      position: absolute;
      top: 2px;
      right: 2px;
      background: var(--danger);
      color: #fff;
      font-size: 0.6rem;
      padding: 1px 5px;
      border-radius: 10px;
      font-weight: 700;
    }

    .navbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .connects-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .connects-icon {
      font-size: 1rem;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-name {
      font-size: 0.85rem;
      font-weight: 500;
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .logout-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .navbar-toggle {
      display: none;
      flex-direction: column;
      gap: 4px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
    }

    .navbar-toggle span {
      display: block;
      width: 22px;
      height: 2px;
      background: #fff;
      border-radius: 2px;
      transition: all 0.3s;
    }

    /* ========================
       AUTH PAGE
       ======================== */
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f5f0ff 0%, #eef2ff 100%);
      padding: 20px;
    }

    .auth-card {
      background: var(--card-bg);
      padding: 48px 40px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      max-width: 440px;
      width: 100%;
      text-align: center;
    }

    .auth-logo {
      margin-bottom: 12px;
    }

    .auth-logo .logo-icon {
      font-size: 3rem;
      color: var(--primary);
      display: block;
      margin-bottom: 8px;
    }

    .auth-logo h1 {
      font-size: 2rem;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .auth-subtitle {
      color: var(--text-muted);
      margin-bottom: 28px;
      font-size: 0.95rem;
    }

    .pi-auth-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .pi-auth-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(123, 63, 228, 0.35);
    }

    .pi-auth-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .pi-icon {
      font-size: 1.3rem;
    }

    .auth-error {
      margin-top: 16px;
      padding: 12px;
      background: #fff5f5;
      color: var(--danger);
      border-radius: 8px;
      font-size: 0.9rem;
      border-left: 3px solid var(--danger);
    }

    .auth-features {
      margin-top: 32px;
      text-align: left;
      display: grid;
      gap: 12px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--bg);
      border-radius: 8px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .feature-icon {
      font-size: 1.2rem;
    }

    /* ========================
       HERO SECTION
       ======================== */
    .hero {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: #fff;
      padding: 80px 20px 60px;
      text-align: center;
    }

    .hero-content h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    .hero-content p {
      font-size: 1.15rem;
      opacity: 0.9;
      max-width: 560px;
      margin: 0 auto 32px;
    }

    .hero-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ========================
       PAGE CONTAINER
       ======================== */
    .page-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .page-header h1 {
      font-size: 1.8rem;
      color: var(--text);
    }

    /* ========================
       BUTTONS
       ======================== */
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: #fff;
    }

    .btn-secondary {
      background: #fff;
      color: var(--primary);
      border: 1.5px solid var(--primary);
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-large {
      padding: 14px 28px;
      font-size: 1rem;
    }

    .btn-back {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 8px 0;
      margin-bottom: 12px;
    }

    .btn-back:hover {
      color: var(--text);
    }

    /* ========================
       LOADING STATES
       ======================== */
    .loading-screen,
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 16px;
      color: var(--text-muted);
    }

    .loading-screen {
      min-height: 100vh;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .spinner.large {
      width: 40px;
      height: 40px;
      border-width: 3px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ========================
       MESSAGES / ALERTS
       ======================== */
    .error-message,
    .error-container {
      background: #fff5f5;
      color: var(--danger);
      padding: 16px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      border-left: 3px solid var(--danger);
    }

    .error-container {
      text-align: center;
      padding: 48px;
      max-width: 500px;
      margin: 40px auto;
      border-left: none;
    }

    .error-container h1 {
      font-size: 4rem;
      color: var(--text);
      margin-bottom: 8px;
    }

    .error-container p {
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .error-message button {
      margin-left: 12px;
    }

    .success-message {
      background: #f0fff4;
      color: var(--success);
      padding: 16px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      border-left: 3px solid var(--success);
    }

    /* ========================
       EMPTY STATE
       ======================== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state p {
      margin-bottom: 8px;
    }

    .empty-state p:last-of-type {
      margin-bottom: 20px;
    }

    /* ========================
       SEARCH & FILTERS
       ======================== */
    .search-section {
      background: var(--card-bg);
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .search-bar,
    .search-form,
    .filters-bar {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filters-bar {
      margin-bottom: 24px;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      padding: 10px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.9rem;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .category-select,
    .sort-select {
      padding: 10px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.9rem;
      background: #fff;
      min-width: 160px;
    }

    .chat-search {
      margin-bottom: 20px;
    }

    .chat-search .search-input {
      width: 100%;
    }

    /* ========================
       JOB CARDS / GRID
       ======================== */
    .jobs-section {
      padding: 40px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .jobs-section h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    .jobs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .job-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid var(--border);
    }

    .job-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .job-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .job-status-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .job-status-badge.large {
      font-size: 0.85rem;
      padding: 6px 16px;
    }

    .job-date {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .job-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text);
      line-height: 1.3;
    }

    .job-description {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .job-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .job-meta span {
      font-size: 0.8rem;
      padding: 4px 10px;
      background: var(--bg);
      border-radius: 6px;
      color: var(--text-muted);
    }

    .job-budget {
      background: #f0e6ff !important;
      color: var(--primary) !important;
      font-weight: 600 !important;
    }

    .job-skills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .skill-tag {
      font-size: 0.75rem;
      padding: 3px 10px;
      background: #eef2ff;
      color: var(--secondary);
      border-radius: 20px;
      font-weight: 500;
    }

    .section-footer {
      text-align: center;
      margin-top: 24px;
    }

    /* ========================
       JOB DETAIL
       ======================== */
    .job-detail {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: var(--shadow);
    }

    .job-detail-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .job-detail-title {
      font-size: 1.8rem;
      margin-bottom: 16px;
    }

    .job-detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      padding: 16px;
      background: var(--bg);
      border-radius: var(--radius);
    }

    .meta-item {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .meta-item strong {
      color: var(--text);
    }

    .job-detail-section {
      margin-bottom: 24px;
    }

    .job-detail-section h3 {
      font-size: 1.1rem;
      margin-bottom: 10px;
    }

    .job-detail-description {
      line-height: 1.7;
      color: var(--text-muted);
      white-space: pre-wrap;
    }

    .job-detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    /* ========================
       APPLY FORM
       ======================== */
    .apply-form-container {
      margin-top: 32px;
      padding: 24px;
      background: var(--bg);
      border-radius: var(--radius);
    }

    /* ========================
       JOB LIST (List View)
       ======================== */
    .jobs-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .job-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 16px;
    }

    .job-list-info {
      flex: 1;
      min-width: 250px;
    }

    .job-list-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      margin-bottom: 6px;
    }

    .job-list-title:hover {
      color: var(--primary);
    }

    .job-list-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .job-list-actions {
      display: flex;
      gap: 8px;
    }

    /* ========================
       APPLICATIONS
       ======================== */
    .applications-section {
      margin-top: 32px;
    }

    .application-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .application-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .application-letter {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .application-budget {
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .application-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .app-status {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #fff;
    }

    .app-status-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #fff;
    }

    .applications-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .application-card-full {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .application-card-full .application-header {
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .application-body {
      margin-bottom: 16px;
    }

    .application-body p {
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .application-cover {
      margin-top: 10px;
      padding: 12px;
      background: var(--bg);
      border-radius: 8px;
    }

    .application-cover p {
      margin-top: 6px;
      font-style: italic;
    }

    .application-date {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .application-list-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 20px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 16px;
    }

    .application-info {
      flex: 1;
      min-width: 250px;
    }

    .application-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .application-preview {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .application-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* ========================
       TABS
       ======================== */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--border);
    }

    .tab-btn {
      padding: 12px 20px;
      background: none;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* ========================
       CHAT
       ======================== */
    .conversations-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .conversation-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: var(--card-bg);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid var(--border);
      position: relative;
    }

    .conversation-card:hover {
      box-shadow: var(--shadow);
    }

    .conversation-card.unread {
      background: #f5f0ff;
      border-color: var(--primary-light);
    }

    .conv-avatar {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .conv-avatar.small {
      width: 36px;
      height: 36px;
      min-width: 36px;
      font-size: 1rem;
    }

    .avatar-letter {
      line-height: 1;
    }

    .conv-body {
      flex: 1;
      min-width: 0;
    }

    .conv-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .conv-name {
      font-size: 0.95rem;
      color: var(--text);
    }

    .conv-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .conv-preview {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conv-unread-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 20px;
      height: 20px;
      background: var(--danger);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Chat Room */
    .chat-room {
      display: flex;
      flex-direction: column;
      height: calc(100vh - var(--nav-height));
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--card-bg);
    }

    .chat-participant {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .chat-error {
      padding: 12px;
      background: #fff5f5;
      color: var(--danger);
      font-size: 0.85rem;
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fafbfc;
    }

    .empty-messages {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .message-bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.45;
      word-break: break-word;
    }

    .message-bubble.sent {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message-bubble.received {
      align-self: flex-start;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .message-bubble.pending {
      opacity: 0.7;
    }

    .message-bubble.failed {
      border-color: var(--danger);
    }

    .message-content {
      margin-bottom: 4px;
    }

    .message-time {
      font-size: 0.7rem;
      opacity: 0.7;
    }

    .chat-input-form {
      display: flex;
      gap: 12px;
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--card-bg);
    }

    .chat-input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.9rem;
      transition: border-color 0.2s;
    }

    .chat-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* ========================
       ESCROW
       ======================== */
    .escrow-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .escrow-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .escrow-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .escrow-status {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #fff;
    }

    .escrow-details {
      margin-bottom: 16px;
    }

    .escrow-details p {
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .escrow-actions {
      display: flex;
      gap: 10px;
    }

    /* ========================
       PROFILE
       ======================== */
    .profile-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: var(--shadow);
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 2rem;
      font-weight: 700;
    }

    .profile-info h2 {
      font-size: 1.5rem;
    }

    .profile-title {
      color: var(--text-muted);
      margin-top: 2px;
    }

    .profile-username {
      color: var(--primary);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .profile-section {
      margin-bottom: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .profile-section h3 {
      font-size: 1rem;
      margin-bottom: 10px;
      color: var(--text);
    }

    .profile-section p {
      color: var(--text-muted);
      line-height: 1.6;
    }

    .profile-section a {
      color: var(--primary);
      text-decoration: none;
    }

    .profile-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-item {
      text-align: center;
      padding: 16px;
      background: var(--bg);
      border-radius: var(--radius);
    }

    .stat-value {
      display: block;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* ========================
       CONNECTS
       ======================== */
    .connects-balance-card {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 28px;
      color: #fff;
    }

    .balance-display {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .balance-icon {
      font-size: 2.5rem;
    }

    .balance-number {
      display: block;
      font-size: 2.5rem;
      font-weight: 800;
    }

    .balance-label {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .connects-info {
      color: var(--text-muted);
      margin-bottom: 28px;
      font-size: 0.95rem;
    }

    .packages-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .package-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 28px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 2px solid var(--border);
      position: relative;
      transition: transform 0.2s;
    }

    .package-card:hover {
      transform: translateY(-2px);
    }

    .package-card.popular {
      border-color: var(--primary);
    }

    .popular-badge {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .package-card h3 {
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .package-quantity {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .package-quantity span {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .package-price {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .package-price span {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .connects-faq {
      max-width: 700px;
    }

    .connects-faq h3 {
      margin-bottom: 16px;
    }

    .connects-faq details {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 10px;
      cursor: pointer;
      border: 1px solid var(--border);
    }

    .connects-faq summary {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .connects-faq p {
      margin-top: 10px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* ========================
       REVIEWS
       ======================== */
    .reviews-summary {
      text-align: center;
      padding: 24px;
      background: var(--card-bg);
      border-radius: var(--radius);
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }

    .rating-big {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .rating-number {
      font-size: 3rem;
      font-weight: 800;
      color: var(--primary);
    }

    .rating-stars {
      font-size: 1.5rem;
      color: #fbbf24;
    }

    .rating-count {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .star {
      color: #d1d5db;
      font-size: 1rem;
    }

    .star.filled {
      color: #fbbf24;
    }

    .star-rating-input {
      display: flex;
      gap: 4px;
    }

    .star-btn {
      background: none;
      border: none;
      font-size: 2rem;
      color: #d1d5db;
      cursor: pointer;
      transition: color 0.2s;
      padding: 0 4px;
    }

    .star-btn.filled {
      color: #fbbf24;
    }

    .star-btn:hover {
      color: #fbbf24;
    }

    .reviews-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .review-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .review-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .reviewer-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .review-stars {
      color: #fbbf24;
      font-size: 0.9rem;
    }

    .review-date {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .review-comment {
      color: var(--text-muted);
      line-height: 1.5;
    }

    .review-job {
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* ========================
       FORM STYLES
       ======================== */
    .form-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
      max-width: 700px;
      margin-bottom: 24px;
    }

    .form-card h3 {
      margin-bottom: 20px;
      font-size: 1.2rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.9rem;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    /* ========================
       HOW IT WORKS
       ======================== */
    .how-it-works {
      background: var(--card-bg);
      padding: 60px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .how-it-works h2 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 1.8rem;
    }

    .steps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
    }

    .step-card {
      text-align: center;
      padding: 32px 24px;
      background: var(--bg);
      border-radius: var(--radius);
    }

    .step-number {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: 700;
      margin: 0 auto 16px;
    }

    .step-card h3 {
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    .step-card p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* ========================
       FOOTER
       ======================== */
    .footer {
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
    }

    /* ========================
       LOAD MORE
       ======================== */
    .load-more {
      text-align: center;
      padding: 24px;
    }

    /* ========================
       RESPONSIVE
       ======================== */
    @media (max-width: 768px) {
      .navbar-toggle {
        display: flex;
      }

      .navbar-links {
        position: fixed;
        top: var(--nav-height);
        left: 0;
        right: 0;
        background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        flex-direction: column;
        align-items: stretch;
        padding: 12px 20px;
        gap: 4px;
        display: none;
      }

      .navbar-links.open {
        display: flex;
      }

      .nav-link {
        padding: 12px 16px;
        border-radius: 8px;
      }

      .navbar-right {
        gap: 8px;
      }

      .user-name {
        display: none;
      }

      .hero-content h1 {
        font-size: 1.8rem;
      }

      .hero-content p {
        font-size: 1rem;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .job-list-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .packages-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .jobs-grid {
        grid-template-columns: 1fr;
      }

      .profile-stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .chat-room {
        max-width: 100%;
      }

      .auth-card {
        padding: 32px 20px;
      }
    }
  </style>
