<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio - Work Pro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; }
  .container { max-width: 900px; margin: 0 auto; padding: 20px; }
  .header { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; align-items: center; gap: 20px; }
  .avatar { width: 80px; height: 80px; border-radius: 50%; background: #10b981; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 600; flex-shrink: 0; }
  .header-info { flex: 1; }
  .header-info h1 { font-size: 24px; margin-bottom: 4px; }
  .headline { color: #666; font-size: 16px; margin-bottom: 12px; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; }
  .stat { background: #f0fdf4; color: #10b981; padding: 4px 12px; border-radius: 16px; font-size: 13px; font-weight: 500; }
  .actions { margin-top: 12px; }
  .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; font-weight: 500; }
  .btn-primary { background: #10b981; color: #fff; }
  .btn-secondary { background: #e5e7eb; color: #374151; }
  .btn-danger { background: #ef4444; color: #fff; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .card h2 { font-size: 18px; margin-bottom: 16px; color: #1f2937; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 4px; }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; font-family: inherit;
  }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .hidden { display: none; }
  .empty { text-align: center; padding: 40px; color: #6b7280; }
  .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .item-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .item-image { width: 100%; height: 180px; object-fit: cover; background: #f3f4f6; }
  .item-body { padding: 16px; }
  .item-category { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #10b981; font-weight: 600; }
  .item-title { font-size: 18px; margin: 8px 0; }
  .item-desc { font-size: 14px; color: #666; line-height: 1.5; }
  .item-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .tag { background: #f0fdf4; color: #10b981; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  .loading { text-align: center; padding: 60px; }
  .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #e5e7eb; border-top-color: #10b981; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { background: #fee2e2; color: #991b1b; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; color: #10b981; text-decoration: none; font-weight: 500; margin-bottom: 16px; }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .links { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
  .links a { color: #10b981; text-decoration: none; font-size: 14px; }
  @media (max-width: 640px) {
    .header { flex-direction: column; text-align: center; }
    .form-row { grid-template-columns: 1fr; }
    .items-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">&larr; Back to Work Pro</a>
    
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p style="margin-top:12px;color:#666;">Loading portfolio...</p>
    </div>
    
    <div id="error" class="error hidden"></div>
    
    <div id="portfolio-content" class="hidden">
      <div class="header">
        <div class="avatar" id="avatar">U</div>
        <div class="header-info">
          <h1 id="username">Pi User</h1>
          <p class="headline" id="headline"></p>
          <div class="stats" id="stats"></div>
          <div class="actions" id="header-actions"></div>
        </div>
      </div>
      
      <div id="edit-form" class="card hidden">
        <h2>Edit Portfolio</h2>
        <form id="portfolio-form">
          <div class="form-group">
            <label>Professional Headline</label>
            <input type="text" id="f-headline" placeholder="e.g. Full Stack Developer">
          </div>
          <div class="form-group">
            <label>Summary</label>
            <textarea id="f-summary" rows="4" placeholder="Describe your expertise..."></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Experience (years)</label>
              <input type="number" id="f-experience" min="0">
            </div>
            <div class="form-group">
              <label>Website</label>
              <input type="url" id="f-website" placeholder="https://...">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>GitHub</label>
              <input type="url" id="f-github" placeholder="https://github.com/...">
            </div>
            <div class="form-group">
              <label>LinkedIn</label>
              <input type="url" id="f-linkedin" placeholder="https://linkedin.com/in/...">
            </div>
          </div>
          <div style="margin-top:8px;">
            <button type="submit" class="btn btn-primary" id="save-btn">Save Changes</button>
            <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
          </div>
        </form>
      </div>
      
      <div id="about-section" class="card hidden">
        <h2>About</h2>
        <p id="summary-text"></p>
      </div>
      
      <div id="links-section" class="card hidden">
        <h2>Links</h2>
        <div class="links" id="links-list"></div>
      </div>
      
      <div class="card">
        <div class="section-header">
          <h2>Work Samples (<span id="item-count">0</span>)</h2>
          <div id="items-actions"></div>
        </div>
        
        <div id="add-item-form" class="hidden" style="margin-bottom:20px;padding:16px;background:#f8fafc;border-radius:8px;">
          <h3 style="margin-bottom:12px;">Add New Work</h3>
          <form id="item-form">
            <div class="form-group">
              <label>Title *</label>
              <input type="text" id="i-title" required placeholder="Project title">
            </div>
            <div class="form-group">
              <label>Description</label>
              <textarea id="i-description" rows="3" placeholder="What you built..."></textarea>
            </div>
            <div class="form-group">
              <label>Image URL</label>
              <input type="url" id="i-image" placeholder="https://...">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Category</label>
                <select id="i-category">
                  <option>Development</option>
                  <option>Design</option>
                  <option>Writing</option>
                  <option>Marketing</option>
                  <option>Data</option>
                  <option>Video</option>
                  <option>Music</option>
                  <option>Other</option>
                </select>
              </div>
              <div class="form-group">
                <label>Tags (comma separated)</label>
                <input type="text" id="i-tags" placeholder="React, Node.js">
              </div>
            </div>
            <button type="submit" class="btn btn-primary" id="add-btn">Add Work</button>
          </form>
        </div>
        
        <div id="items-empty" class="empty hidden">
          <p>No work samples yet.</p>
          <p id="empty-hint" class="hidden">Add projects to showcase your skills.</p>
        </div>
        <div id="items-grid" class="items-grid"></div>
      </div>
    </div>
  </div>

<script>
(function() {
  'use strict';
  
  const API = 'https://workpro-api.onrender.com';
  let currentUser = null;
  let targetUserId = null;
  let isOwn = false;
  let portfolio = null;
  let items = [];
  let stats = {};
  
  function getUserFromStorage() {
    try {
      const stored = localStorage.getItem('workpro_user');
      if (stored) return JSON.parse(stored);
    } catch(e) {}
    return null;
  }
  
  function getUidFromUrl() {
    const hash = window.location.hash || '';
    const match = hash.match(/\/portfolio\/([^/]+)/);
    if (match) return match[1];
    return null;
  }
  
  function show(el) { el.classList.remove('hidden'); }
  function hide(el) { el.classList.add('hidden'); }
  function setText(id, text) { document.getElementById(id).textContent = text || ''; }
  
  function renderStars(rating) {
    const r = Math.round(parseFloat(rating) || 0);
    return '\u2605'.repeat(r) + '\u2606'.repeat(5 - r);
  }
  
  async function fetchPortfolio() {
    show(document.getElementById('loading'));
    hide(document.getElementById('portfolio-content'));
    hide(document.getElementById('error'));
    
    try {
      const headers = { 'Content-Type': 'application/json' };
      if (currentUser && currentUser.uid) headers['x-user-id'] = currentUser.uid;
      
      const res = await fetch(`${API}/api/users/${targetUserId}/portfolio`, { headers });
      if (!res.ok) throw new Error('Failed to fetch portfolio');
      const data = await res.json();
      
      portfolio = data.portfolio || {};
      items = data.items || [];
      stats = data.stats || { jobs_posted: 0, jobs_completed: 0, rating: 0 };
      
      renderPortfolio();
    } catch(err) {
      hide(document.getElementById('loading'));
      const errEl = document.getElementById('error');
      errEl.textContent = err.message;
      show(errEl);
    }
  }
  
  function renderPortfolio() {
    hide(document.getElementById('loading'));
    show(document.getElementById('portfolio-content'));
    
    const user = isOwn ? currentUser : (portfolio.user || {});
    setText('username', user.username || 'Pi User');
    setText('headline', portfolio.headline);
    document.getElementById('avatar').textContent = (user.username || 'U').charAt(0).toUpperCase();
    
    const statsEl = document.getElementById('stats');
    statsEl.innerHTML = '';
    const addStat = (text) => {
      const span = document.createElement('span');
      span.className = 'stat';
      span.textContent = text;
      statsEl.appendChild(span);
    };
    addStat(`${stats.jobs_completed || 0} completed`);
    if (stats.rating) addStat(`${stats.rating.toFixed(1)} ${renderStars(stats.rating)}`);
    if (portfolio.experience_years > 0) addStat(`${portfolio.experience_years}+ years exp`);
    
    const headerActions = document.getElementById('header-actions');
    headerActions.innerHTML = '';
    if (isOwn) {
      const btn = document.createElement('button');
      btn.className = 'btn btn-primary';
      btn.textContent = 'Edit Portfolio';
      btn.onclick = () => { show(document.getElementById('edit-form')); fillEditForm(); };
      headerActions.appendChild(btn);
    }
    
    if (portfolio.summary) {
      show(document.getElementById('about-section'));
      setText('summary-text', portfolio.summary);
    } else {
      hide(document.getElementById('about-section'));
    }
    
    const hasLinks = portfolio.website || portfolio.github || portfolio.linkedin;
    if (hasLinks) {
      show(document.getElementById('links-section'));
      const linksEl = document.getElementById('links-list');
      linksEl.innerHTML = '';
      const addLink = (url, text) => {
        const a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = text;
        linksEl.appendChild(a);
      };
      if (portfolio.website) addLink(portfolio.website, '\ud83c\udf10 Website');
      if (portfolio.github) addLink(portfolio.github, '\ud83d\udcbb GitHub');
      if (portfolio.linkedin) addLink(portfolio.linkedin, '\ud83d\udcbc LinkedIn');
    } else {
      hide(document.getElementById('links-section'));
    }
    
    setText('item-count', items.length);
    
    const actionsEl = document.getElementById('items-actions');
    actionsEl.innerHTML = '';
    if (isOwn) {
      const btn = document.createElement('button');
      btn.className = 'btn btn-primary';
      btn.textContent = '+ Add Work';
      btn.onclick = () => {
        const form = document.getElementById('add-item-form');
        form.classList.toggle('hidden');
      };
      actionsEl.appendChild(btn);
    }
    
    const grid = document.getElementById('items-grid');
    grid.innerHTML = '';
    
    if (items.length === 0) {
      show(document.getElementById('items-empty'));
      if (isOwn) show(document.getElementById('empty-hint'));
    } else {
      hide(document.getElementById('items-empty'));
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        
        let html = '';
        if (item.image_url) {
          html += `<img src="${item.image_url}" alt="${item.title}" class="item-image" loading="lazy">`;
        }
        html += `<div class="item-body">`;
        html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">`;
        html += `<span class="item-category">${item.category}</span>`;
        if (isOwn) {
          html += `<button class="btn btn-danger btn-sm" data-id="${item.id}">\u2715</button>`;
        }
        html += `</div>`;
        html += `<h3 class="item-title">${item.title}</h3>`;
        if (item.description) html += `<p class="item-desc">${item.description}</p>`;
        if (item.tags) {
          html += `<div class="item-tags">`;
          item.tags.split(',').forEach(tag => {
            tag = tag.trim();
            if (tag) html += `<span class="tag">${tag}</span>`;
          });
          html += `</div>`;
        }
        html += `</div>`;
        
        card.innerHTML = html;
        
        if (isOwn) {
          const delBtn = card.querySelector('button[data-id]');
          if (delBtn) {
            delBtn.onclick = () => deleteItem(item.id);
          }
        }
        
        grid.appendChild(card);
      });
    }
  }
  
  function fillEditForm() {
    document.getElementById('f-headline').value = portfolio.headline || '';
    document.getElementById('f-summary').value = portfolio.summary || '';
    document.getElementById('f-experience').value = portfolio.experience_years || 0;
    document.getElementById('f-website').value = portfolio.website || '';
    document.getElementById('f-github').value = portfolio.github || '';
    document.getElementById('f-linkedin').value = portfolio.linkedin || '';
  }
  
  async function savePortfolio(e) {
    e.preventDefault();
    const btn = document.getElementById('save-btn');
    btn.textContent = 'Saving...';
    btn.disabled = true;
    
    const body = {
      headline: document.getElementById('f-headline').value,
      summary: document.getElementById('f-summary').value,
      experience_years: parseInt(document.getElementById('f-experience').value) || 0,
      website: document.getElementById('f-website').value,
      github: document.getElementById('f-github').value,
      linkedin: document.getElementById('f-linkedin').value
    };
    
    try {
      const res = await fetch(`${API}/api/users/me/portfolio`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'x-user-id': currentUser.uid },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error('Failed to save');
      hide(document.getElementById('edit-form'));
      await fetchPortfolio();
    } catch(err) {
      alert(err.message);
    } finally {
      btn.textContent = 'Save Changes';
      btn.disabled = false;
    }
  }
  
  async function addItem(e) {
    e.preventDefault();
    const btn = document.getElementById('add-btn');
    btn.textContent = 'Adding...';
    btn.disabled = true;
    
    const tags = document.getElementById('i-tags').value.split(',').map(t => t.trim()).filter(Boolean);
    const body = {
      title: document.getElementById('i-title').value,
      description: document.getElementById('i-description').value,
      image_url: document.getElementById('i-image').value,
      category: document.getElementById('i-category').value,
      tags: tags
    };
    
    try {
      const res = await fetch(`${API}/api/users/me/portfolio/items`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-user-id': currentUser.uid },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error('Failed to add');
      hide(document.getElementById('add-item-form'));
      document.getElementById('item-form').reset();
      await fetchPortfolio();
    } catch(err) {
      alert(err.message);
    } finally {
      btn.textContent = 'Add Work';
      btn.disabled = false;
    }
  }
  
  async function deleteItem(id) {
    if (!confirm('Remove this item?')) return;
    try {
      const res = await fetch(`${API}/api/users/me/portfolio/items/${id}`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json', 'x-user-id': currentUser.uid }
      });
      if (!res.ok) throw new Error('Failed to delete');
      await fetchPortfolio();
    } catch(err) {
      alert(err.message);
    }
  }
  
  // Init
  currentUser = getUserFromStorage();
  const urlUid = getUidFromUrl();
  if (urlUid) {
    targetUserId = urlUid;
    isOwn = currentUser && currentUser.uid === urlUid;
  } else if (currentUser) {
    targetUserId = currentUser.uid;
    isOwn = true;
  } else {
    document.getElementById('error').textContent = 'Please sign in to view portfolio.';
    show(document.getElementById('error'));
    hide(document.getElementById('loading'));
    return;
  }
  
  document.getElementById('portfolio-form').onsubmit = savePortfolio;
  document.getElementById('cancel-btn').onclick = () => hide(document.getElementById('edit-form'));
  document.getElementById('item-form').onsubmit = addItem;
  
  fetchPortfolio();
})();
</script>
</body>
</html>
