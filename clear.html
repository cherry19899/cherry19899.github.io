<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clearing Cache...</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#060f0f}
.box{text-align:center;padding:32px;background:#0d1f1f;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.5);max-width:300px;border:1px solid rgba(255,255,255,0.08)}
h2{margin:0 0 8px;color:rgba(255,255,255,0.9);font-size:18px}
p{margin:0;color:rgba(255,255,255,0.5);font-size:14px}
.spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);border-top-color:#10b981;border-radius:50%;animation:spin 1s linear infinite;margin:16px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <h2 id="t">Clearing cache...</h2>
  <p id="m">Please wait</p>
</div>
<script>
var msgs = {
  en: {t: 'Clearing cache...', m: 'Reloading app'},
  ru: {t: 'Очистка кэша...', m: 'Перезагрузка приложения'},
  es: {t: 'Borrando caché...', m: 'Recargando app'},
  de: {t: 'Cache leeren...', m: 'App wird neu geladen'},
  fr: {t: 'Vidage du cache...', m: 'Rechargement'},
  it: {t: 'Cancellazione cache...', m: 'Ricaricamento'},
  pt: {t: 'Limpando cache...', m: 'Recarregando app'},
  pl: {t: 'Czyszczenie pamięci...', m: 'Ponowne ładowanie'},
  uk: {t: 'Очищення кешу...', m: 'Перезавантаження'},
  ja: {t: 'キャッシュをクリア中...', m: 'アプリを再読み込み'},
  ko: {t: '캐시 지우는 중...', m: '앱 다시 로드'},
  zh: {t: '清除缓存中...', m: '重新加载应用'}
};
try {
  var lang = localStorage.getItem('workpro_lang') || 'en';
  var msg = msgs[lang] || msgs.en;
  document.getElementById('t').textContent = msg.t;
  document.getElementById('m').textContent = msg.m;
  localStorage.clear();
  sessionStorage.clear();
  console.log('[ClearCache] All storage cleared');
} catch(e) {
  console.error('[ClearCache] Error:', e);
}
setTimeout(function(){
  window.location.href = '/';
}, 1500);
</script>
</body>
</html>
