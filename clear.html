<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clear Cache — Work Pro</title>
  <style>body{font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;background:#f0fdf4;color:#064e3b;}h1{font-size:24px;margin-bottom:12px;}p{color:#666;font-size:14px;margin-bottom:20px;}button{padding:12px 32px;background:#0d9488;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer;}button:hover{background:#0f766e;}</style>
</head>
<body>
  <h1>Clear Cache</h1>
  <p>This will clear all local data and reload the app.</p>
  <button onclick="clearAll()">Clear &amp; Reload</button>
  <script>
    function clearAll() {
      try {
        localStorage.clear();
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(n) { caches.delete(n); });
          });
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
        }
      } catch(e) {}
      setTimeout(function() { window.location.href = '/app-v197.html?v=197&nocache=' + Date.now(); }, 800);
    }
  </script>
</body>
</html>
